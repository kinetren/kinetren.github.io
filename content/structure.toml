# The landing page's form: section order, components, images and the facts
# that are NOT translated.
#
# Introduced in round R.19 on the request to generate the landing page from
# something formal: before that the page was a hand-written 446 KB blob.
# The split is simple and strict:
#   * HERE — whatever is the same in every language: section order, which
#            component draws each section, image names, effect
#            names (i18n/README.md, rule 4: FX names are not translated),
#            the numbers in the stats strip;
#   * content/<lang>.toml — prose only.
# So a translator has nothing to break in the layout, and a layout change
# does not touch five catalogs.
#
# A section's id is the prefix of its keys in the catalogs: [[section]]
# id="edit" reads the keys of [edit]. The order of [[section]] here is the
# order on the page.
#
# upstream = the editor paths (files or directories in github.com/kinetren/
# kinetren) that a section's facts are written from. `python3 upstream.py
# status` groups the editor's changes by these lists, so an update knows which
# sections to reread. The roadmap's versions come from the editor's v* tags.

[site]
langs   = ["en", "es", "zh-Hans", "ar", "ru"]
default = "en"
rtl     = ["ar"]
# The share of translated values below which a language counts as not ready:
# its page is built but gets noindex and stays out of sitemap/hreflang.
translated_min = 0.9
# Where the download button of the "Get it" section leads; there is no version
# label on the page — the releases page is the version of record.
releases = "https://github.com/kinetren/kinetren/releases"
# The editor's source repository: linked from the header and the footer.
github = "https://github.com/kinetren/kinetren"
discord = "https://discord.gg/gXdzZQYY4e"
youtube = "https://www.youtube.com/@kinetren"

# ----------------------------------------------------------------- images --
# Every <img> gets width/height, or the page jumps while loading (with
# height:auto in the CSS, so images are never stretched).
# Sizes are not written here: build.py reads them from the image files.
# One English set serves every language (owner, 2026-10-24): the files are the
# kinetren editor's own showcase shots from its docs/images/, imported by
# `python3 upstream.py import` — never edited here. Images the guide shows are
# imported too, without a slot.
[shot.hero]
file = "hero.webp"

[shot.timeline]
file = "timeline.webp"

[shot.fx_video]
file = "video-fx.webp"

[shot.fx_audio]
file = "slowed-reverb-automation.webp"

[shot.morpher]
file = "morpher.webp"

[shot.bin]
file = "media-bin.webp"

[shot.render_settings]
file = "render-dialog.webp"

# ------------------------------------------------------------------- docs --
# The editor's user guide (docs/guide/*.md), imported byte for byte into
# assets/guide/ by upstream.py and rendered in English under /docs/. The order
# here is the order of the guide index; a page the editor adds or removes
# fails the build until it is placed here or taken out.
[docs]
pages = [
  "getting-started",
  "timeline",
  "effects-and-automation",
  "compositions-and-generators",
  "morpher",
  "export",
  "shortcuts",
]

# --------------------------------------------------------------- sections --

[[section]]
id        = "hero"
upstream  = [
  "README.md",
  "src/apps/kt-app/i18n/en.toml",
  "src/apps/kt-app/src/fx_registry.rs",
]
component = "hero"
shot      = "hero"
inset     = "timeline"
# The numbers are facts about the product, not prose: the catalogs hold only
# the labels under them.
# Hovering (or focusing) a number shows what it counts: stats.<id>_list.
stats     = ["26", "18", "33", "4", "5"]
stat_ids  = ["vfx", "afx", "transitions", "tracks", "langs"]

[[section]]
id        = "why"
upstream  = [
  "openspec/specs/video-plan",
  "openspec/specs/export",
  "openspec/specs/media-index",
]
component = "cards"
timecode  = "00:00:00"
slab      = "none"
cols      = 4
items     = ["ship", "same", "stall", "gpu"]

[[section]]
id        = "edit"
upstream  = [
  "docs/guide/timeline.md",
  "openspec/specs/ui-timeline",
  "openspec/specs/compositions",
]
component = "shot_then_lists"
timecode  = "00:00:12"
slab      = "plain"
shot      = "timeline"
left      = ["cut", "region", "snap", "marker"]
right     = ["reels", "fades", "find", "undo"]

[[section]]
id        = "playback"
upstream  = ["openspec/specs/transport", "docs/guide/shortcuts.md"]
component = "cards"
timecode  = "00:00:34"
slab      = "none"
cols      = 3
items     = ["speed", "space", "reverse", "loop", "meters", "detach"]

[[section]]
id        = "effects"
upstream  = [
  "docs/guide/effects-and-automation.md",
  "openspec/specs/video-fx",
  "openspec/specs/audio-fx",
  "openspec/specs/automation",
  "src/apps/kt-app/src/fx_registry.rs",
]
component = "effects"
timecode  = "00:00:48"
slab      = "plain"
shot      = "fx_video"
shot2     = "fx_audio"
audio     = ["list", "slowed"]

[[section]]
id        = "more"
upstream  = [
  "docs/guide/compositions-and-generators.md",
  "openspec/specs/transitions",
  "openspec/specs/generators",
]
component = "cards"
timecode  = "00:00:55"
slab      = "none"
cols      = 3
items     = ["transitions", "titles", "generators"]

[[section]]
id        = "morpher"
upstream  = ["docs/guide/morpher.md", "openspec/specs/morpher"]
component = "list_and_shot"
timecode  = "00:01:02"
slab      = "violet"
shot      = "morpher"
items     = ["swap", "batch", "delete", "bake"]

[[section]]
id        = "bin"
upstream  = [
  "docs/guide/getting-started.md",
  "openspec/specs/ui-reach",
  "openspec/specs/media-index",
]
component = "shot_and_list"
timecode  = "00:01:16"
slab      = "none"
shot      = "bin"
items     = ["poster", "scrub", "wave", "groups", "layout", "drag"]

[[section]]
id        = "export"
upstream  = ["docs/guide/export.md", "openspec/specs/export"]
component = "list_and_shot"
timecode  = "00:01:30"
slab      = "warm"
shot      = "render_settings"
items     = ["encoder", "quality", "progress", "inproc", "cli"]

[[section]]
id        = "care"
upstream  = ["openspec/specs/durability", "openspec/specs/project-format"]
component = "cards"
timecode  = "00:01:44"
slab      = "none"
cols      = 4
items     = ["autosave", "readable", "cache", "warnings"]

[[section]]
id        = "roadmap"
upstream  = ["openspec/changes/r71-ktprompts-index"]
component = "roadmap"
timecode  = "00:01:58"
slab      = "plain"
# Builds by date, newest first. "26.10.24" is version v26.10.24, shown as
# 26:10:24 in the same style as the section timecodes; the summary is the
# catalog key roadmap.v261024. From 26.10.25 on, the entries are the editor's
# v* tags, one per tag date (v26.10.25 and v26.10.25.1 are one entry);
# `python3 upstream.py facts` checks that no tag date is missing.
versions  = ["26.10.25", "26.10.24", "26.10.22", "26.10.03", "26.09.26", "26.09.22", "26.09.17",
             "26.09.16", "26.09.15", "26.09.14", "26.09.07", "26.09.06", "26.09.04",
             "26.08.29", "26.08.27", "26.08.24", "26.08.22"]
# Planned, in the order of the coming rounds (render, timeline, automation,
# windows, then larger features).
next      = ["formats", "loudness", "vcheck", "crashsafe", "genpick", "ripple", "freeze", "notes", "keys", "presets", "windows", "center", "colour", "denoise", "ducking", "speech", "multicam", "layouts", "plugins", "smart", "lens", "midi", "packages"]

[[section]]
id        = "get"
upstream  = ["README.md", "src/packaging", "src/scripts/release-build.sh"]
component = "install"
timecode  = "00:02:12"
# The timecode of this section is the visitor's current time, ticking.
clock     = true
slab      = "none"
req       = ["system", "windows", "gpu", "video", "sound", "installs"]

# ---------------------------------------------------------------- install --
# Commands are not translated; only the comments above them are (keys
# get.c_install and get.c_render).
[install]
lines = [
  { comment = "c_install" },
  { cmd = "tar xf kinetren-*-linux-x86_64.tar.gz" },
  { cmd = "cd kinetren-*-linux-x86_64" },
  { cmd = "./install.sh" },
  { blank = true },
  { comment = "c_render" },
  { cmd = "kt-cli export project.kt out.mp4" },
]

# ---------------------------------------------------------------- effects --
# The editor's video effects, in the order of its gallery. Names are not
# translated (i18n/README.md, rule 4).
[fx]
names = [
  "Geometry",
  "Mirror",
  "Corner Pin",
  "Blur",
  "Sharpen",
  "Radial Blur",
  "Greenscreen",
  "Drop Shadow",
  "Edges",
  "Noise",
  "VHS",
  "Event Grid",
  "Vignette",
  "Pixelate",
  "Halftone",
  "Glow",
  "Pan 3D",
  "Cylinder 3D",
  "Color Grade",
  "Duotone",
  "Posterize",
  "Chromatic Aberration",
  "Lens Distort",
  "Twirl",
  "Ripple",
  "Kaleidoscope",
]
