[hero]
eyebrow = "Non-linear video editor · Linux"
h1 = "The edit you hear is the <em>file you ship</em>."
lede = "Kinetren is built on one promise: <strong>the preview is the render</strong>. The same composition, the same effects, the same frame — exporting just writes it to disk. Run the same project twice on the same machine and you get identical files, down to the byte."
cta_primary = "Download for Linux"
cta_secondary = "What’s inside"
cta_note = "x86_64 · tarball · installs without root"
shot_alt = "The Kinetren window during playback: the media bin on the left with footage, music and generated titles in named groups, the video preview in the centre with live level meters beside it, and a dense multi-track timeline below with named markers, titles, video, music and a morpher track."

[stats]
fx = "video effects"
tracks = "kinds of track"
path = "render path"
temp = "temp files"

[why]
title = "Why it’s different"
ship_title = "What you see ships"
ship_body = "No proxy path, no “final quality” surprise at the end. The frame in the preview window and the frame in the MP4 come out of the same composition."
same_title = "Same file every time"
same_body = "Render a project today and again next month and the two files match exactly — however much you scrubbed, looped or jumped around beforehand."
stall_title = "The timeline never stalls"
stall_body = "Scrolling and zooming don’t touch your footage. Waveforms, filmstrips and poster frames are read from an index built once per file, so the view stays instant."
gpu_title = "Your GPU encodes it"
gpu_body = "NVIDIA, AMD and Intel hardware encoders are picked automatically, with a software fallback that actually works. No temp files, no scratch disk filling up."

[edit]
title = "The edit"
standfirst = "Video, audio and morph tracks, as many as you want, in any order — drag a track header and the whole row moves. Everything below is one keystroke or one drag away."
shot_alt = "Timeline close-up at the DROP marker: a nested reel opened in place, its own text, video and audio tracks shown between the main tracks with the parts outside the instance veiled on both sides; filmstrips along video clips and waveforms on the audio tracks."
shot_cap = "A reel from the middle of the edit, opened in place: its tracks right on the timeline, everything outside the instance veiled."
cut_title = "Cut and trim"
cut_body = "Split at the playhead with <kbd>S</kbd>. Trim by dragging an edge — narrow clips keep a draggable middle, so you never lose the handle to the trim zones."
region_title = "Regions do the work"
region_body = "Mark in and out with <kbd>I</kbd> and <kbd>O</kbd>, then use the region for everything: copy it, delete it, punch its interior out of every clip it crosses, loop it, render it."
snap_title = "Snapping you can let go of"
snap_body = "On by default, and holding <kbd>Ctrl</kbd> switches it off mid-drag. It catches clip edges, markers, region bounds, the playhead and zero."
marker_title = "Markers with names"
marker_body = "<kbd>M</kbd> drops one and opens the name field. They sit on the ruler, drag with the mouse, and turn up in search."
paste_title = "Paste builds chains"
paste_body = "<kbd>Ctrl</kbd>+<kbd>V</kbd> leaves the playhead at the end of what it pasted, so pressing it again butts the next copy up against it — no gap, no seam, sample-exact."
link_title = "Picture and sound stay together"
link_body = "A clip and its audio move and trim as one until you break the link."
find_title = "Find anything"
find_body = "<kbd>Ctrl</kbd>+<kbd>F</kbd> searches markers, media, tracks, clips and bin groups at once. <kbd>Ctrl</kbd>+<kbd>L</kbd> jumps to a timecode you type."
undo_title = "Undo means undo"
undo_body = "Every change, including morphers and bakes. A gesture is one step: dragging a clip across the timeline undoes as one move, not forty."

[playback]
title = "Playback"
standfirst = "Transport you play rather than operate. <strong>Sound keeps the time</strong> and picture follows it, so nothing drifts on a long take — and the position you watch is smoothed between updates, so playback never looks like it is stepping."
speed_title = "Two speed bars"
speed_body = "The top one holds a constant −2× to +2×. The bottom is a spring-loaded shuttle that snaps back the moment you let go. Drag past the widget and it finds a second wind, up to ±8×. Double-click either for 1×."
space_title = "Hold space to run"
space_body = "Keep <kbd>Space</kbd> down and playback ramps up to 4× over five seconds, then eases back when you release. Tap it for play/pause; tap twice to stop at the top of the region."
reverse_title = "Reverse, for real"
reverse_body = "Negative speed plays frame-exact backwards — audio too — and loops backwards past the region start. Individual clips can be reversed as a property of the clip."
loop_title = "Loops without the click"
loop_body = "Region loops are continuous at the seam, not a re-seek. The head of the region is held in cache so the wrap never stutters."
meters_title = "Meters that read as meters"
meters_body = "Discrete LED segments on a real decibel grid, a peak cap that decays behind them, and a master fader that reads out in dB. Scrub while paused and the meter shows the level under the cursor."
detach_title = "Preview on the other screen"
detach_body = "Double-click the preview and it pops into its own window for a second monitor. Close it and it snaps back into the layout."

[effects]
title = "Effects"
standfirst = "Effects stack in a chain on the clip. Reorder the slots, mute any one of them without deleting it, and see the result in the preview immediately — <strong>the export runs the very same code</strong>."
fx_cap = "Ten video effects. The picker groups them by what they do and filters as you type."
shot_alt = "The video effects window with the effect picker open: a search field, presets with live thumbnails of the clip, and effects grouped by category, each with its own strip of thumbnails."
audio_title = "Sound: two effects, one of them yours"
gain_title = "Gain"
gain_body = "A clean ±24 dB per slot."
slowed_title = "Slowed + Reverb"
slowed_body = "The signature one. Slow the material down and let the pitch fall with it, then wash it in a reverb you shape with delay, decay, damping and wet level. Keyframe rate and mix along the clip."
note = "Two details you feel rather than read about: the envelope is pinned to the <em>material</em>, so nudging an early keyframe doesn’t drag everything after it out of place — and the reverb tail keeps ringing past the end of the clip instead of being chopped off. Editing the clip next door won’t cut it short either."
shot2_alt = "The audio effects window for one clip: Slowed+Reverb parameters, and below them the automation graph with keyframed curves for rate and mix."
shot2_cap = "Rate and mix, keyframed along the clip. Drag the diamonds; copy the envelope onto another clip."

# Effect categories — the same ones the application shows in its picker.
[fxcat]
motion = "Motion"
geometry = "Geometry"
blur = "Blur"
key = "Keying"
style = "Stylize"
glow = "Glow"

[fxdesc]
pan = "Crop, reposition and zoom the frame into the project format. Fit, fill or stretch."
cammotion = "Keyframed camera moves along the clip — push in, pull out, drift across, eased."
mirror = "Flip the frame horizontally, vertically or both."
blur = "Soften the picture by a radius you set."
green = "Key a colour out to transparency with tolerance and softness, so the clip above sits over the one below."
edges = "Sobel outlines — turn footage into line work."
noise = "Film grain that comes out identical in the preview and in the export."
vhs = "Offset RGB channels and jittering scanlines, for tape."
glow = "Bloom on the bright parts of the frame."
grid = "Tile the frame into a grid of cells."

[morpher]
title = "The morpher"
standfirst = "A morpher is a patch you drop on its own purple track. When you make it, it freezes the clips you had selected — and from then on it changes <strong>all of them at once</strong>, without touching a single one of them."
shot_alt = "The morpher FX batch editor: it acts on a frozen list of six clips, chains a source swap with VHS and Glow, sets strength with fade-in and fade-out, picks the new source file, and offers bake and delete."
shot_cap = "Six clips frozen in: a source swap, then VHS and Glow on top. Bake writes it into the clips."
swap_title = "Swap the source under a finished edit"
swap_body = "Point forty cuts at the graded master instead of the rushes, or shift every in-point by the same amount. The edit — every cut, every duration, every position — stays exactly where you put it."
batch_title = "Push effects onto a whole group"
batch_body = "An effect batch appends to the chains of every clip it targets, and it applies live. Nothing to render, nothing to commit."
delete_title = "Delete it and it never happened"
delete_body = "The clips were never modified. Remove the patch and the edit is back where it started."
bake_title = "Bake when you’re sure"
bake_body = "Baking writes the patch into the clips and the block disappears — and the picture and sound don’t change by a single sample. It’s an organisational move, not a render. And yes, it undoes."

[bin]
title = "Media bin"
standfirst = "Drop files on the window and they land as cards. The bin is a place you arrange, not a list you scroll past."
shot_alt = "The media bin in free layout: named groups for footage, music and generated media, video cards with poster frames and durations, music drawn as waveforms, and text generators."
shot_cap = "Groups are named in a break in their frame.<br>Cards show a poster frame, the duration or a waveform."
poster_title = "Poster frames worth looking at"
poster_body = "Each file gets the most informative frame in it — not frame zero, not a black slate, not a fade-up."
scrub_title = "Scrub without opening anything"
scrub_body = "Sweep the mouse across a card and it plays through the file under your cursor."
wave_title = "Sound looks like sound"
wave_body = "Audio files draw their waveform right on the card."
groups_title = "Groups, named and locked"
groups_body = "Select cards, group them, give the group a name, lock it so nothing moves. Drag the group and it travels as one."
layout_title = "Free layout or grid"
layout_body = "Your choice, saved with the project — switching between them never scrambles your arrangement."
drag_title = "Drag onto the timeline"
drag_body = "You get a ghost of the clip, a highlight on the target track and a snap line before you let go."

[export]
title = "Export"
standfirst = "MP4 — H.264 video, AAC 48 kHz stereo, faststart. Region or whole project, chosen by whether you have a region marked."
shot_alt = "Render settings: video codec on automatic with hardware encoders first, CRF quality, audio bitrate, resolution taken from the project, AAC 48 kHz stereo, MP4 container with faststart."
shot_cap = "One dialog: codec, quality, sound and container — then Render."
encoder_title = "Encoders that are actually there"
encoder_body = "Auto tries the hardware encoders in turn and opens each one for real before committing to it. A card that advertises an encoder it can’t run gets skipped, not crashed on. Pick one by hand if you’d rather."
quality_title = "Quality your way"
quality_body = "CRF or a bitrate target, audio from 128 to 320 kbps, output at the project’s own resolution or anything up to 4K."
progress_title = "Progress that tells you something"
progress_body = "Which phase it’s in, an ETA, and how fast it’s going against realtime — minimum, average, current and peak. Pause it or cancel it."
inproc_title = "Nothing leaves the app"
inproc_body = "Encoding and muxing happen in-process. No intermediate files, no scratch folder, no gigabytes of raw footage written out and read back."
cli_title = "Render from a terminal"
cli_body = "A headless command-line tool renders the same project file, for overnight jobs and scripts."

[care]
title = "It looks after your work"
autosave_title = "Autosave that stays out of the way"
autosave_body = "Every 30 seconds — but only when the edit actually changed, and never in the middle of a drag or while you’re playing back. Written atomically, so a crash can’t leave you with half a project file."
readable_title = "Projects you can read"
readable_body = "Plain JSON with relative paths to your media. Move the folder, zip it, hand it to someone else — it still opens. Your view, track names and bin arrangement come back with it."
cache_title = "The cache is just a cache"
cache_body = "Waveforms and thumbnails live in a file beside the project. Delete it, break it, or replace a source file, and only what changed gets rebuilt."
warnings_title = "Plain-language warnings"
warnings_body = "A performance panel with live cache fill, frames shown against frames dropped, and a notification when something is genuinely wrong — “decoding can’t keep up” rather than a counter you have to interpret."

