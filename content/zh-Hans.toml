# kinetren landing — 简体中文. The key set and order are defined by en.toml.
# Markup in values: <em> <strong> <kbd> <code> <br>.
# Not translated: kinetren, MP4, H.264, AAC, FFmpeg and effect names (rule 4 of
# i18n/README.md). Terms follow the editor's own zh-Hans.toml (区间, 片段,
# 播放头, 轨道, 事件, 变形器, 预设).

[site]
tagline = "免费、源代码公开的 Linux 和 Windows 视频编辑器。"
nav_edit = "时间线"
nav_effects = "效果"
nav_morpher = "变形器"
nav_export = "导出"
nav_roadmap = "计划"
nav_docs = "文档"
nav_get = "下载"
lang_label = "语言"
skip = "跳到正文"
footer_desc = "适用于 Linux 和 Windows 的视频编辑器"
credits = "素材来源"
source = "源代码"

# Self-names of the languages. Identical in every catalog — copied verbatim
# from the application's own [lang] section, do not translate them.
[lang]
en = "English"
es = "Español"
zh = "中文（简体）"
ar = "العربية"
ru = "Русский"

[hero]
eyebrow = "视频编辑器 · Linux · Windows"
h1 = "免费的视频编辑器，<em>支持 Linux 和 Windows</em>"
lede = "多轨时间线与实时预览，嵌套片段，33 种转场，26 种视频效果和 18 种音频效果，任意参数都可用曲线自动化，还有字幕和生成器。导出 MP4 时渲染的正是预览中显示的画面。"
cta_primary = "下载"
cta_secondary = "功能"
cta_note = "Linux x86_64 · Windows 10/11"
shot_alt = "播放中的 kinetren 窗口：左侧是媒体面板，素材、音乐和生成的字幕按命名分组；中间是视频预览，旁边是电平表；下方是多轨时间线，带有命名标记、字幕、视频、音乐和一条变形器轨道。"

[stats]
vfx = "种视频效果"
vfx_list = "Geometry · Mirror · Corner Pin · Blur · Sharpen · Radial Blur · Greenscreen · Drop Shadow · Edges · Noise · VHS · Event Grid · Vignette · Pixelate · Halftone · Glow · Pan 3D · Cylinder 3D · Color Grade · Duotone · Posterize · Chromatic Aberration · Lens Distort · Twirl · Ripple · Kaleidoscope"
afx = "种音频效果"
afx_list = "Gain · Slowed+Reverb · Pitch Shift · Filter · EQ · Distortion · Bitcrusher · Tremolo · AutoPan · Vibrato · Chorus · Flanger · Phaser · Delay · Compressor · Gate · Limiter · Stereo Width"
transitions = "种转场"
transitions_list = "交叉溶解 · 划像 · 光圈 · 时钟 · 开门 · 亮度划像 · 推移 · 滑入 · 交叉缩放 · 旋转 · 甩镜 · 模糊溶解 · 像素化 · 故障 · 闪白 · 渐变到色 · 百叶窗 · 棋盘格 · 随机方块 · 螺旋 · 分裂 · 挤压 · 拉伸 · 交换 · 抖动 · 胶片灼烧 · 漏光 · 径向模糊 · 翻转 · 立方体 · 门扉 · 翻页 · 卷页"
tracks = "种轨道"
tracks_list = "视频 · 音频 · Morph · 摄像机"
langs = "种界面语言"
langs_list = "English · Español · 中文（简体） · العربية · Русский"

[why]
title = "渲染"
ship_title = "同一条渲染路径"
ship_body = "预览和 MP4 导出用同一套代码合成画面。导出的帧就是预览中显示的帧。"
same_title = "结果可重复"
same_body = "同一个项目在同一台机器上渲染两次，得到的文件完全相同，与两次渲染之间播放或拖动过什么无关。"
stall_title = "滚动时不解码视频"
stall_body = "波形、胶片条和缩略图读自每个文件只建一次的索引。时间线的滚动和缩放只使用这个索引。"
gpu_title = "硬件编码"
gpu_body = "自动检测 NVIDIA、AMD 和 Intel 编码器，不可用时改用软件编码器。导出过程不写临时文件。"

[edit]
title = "时间线"
standfirst = "视频、音频和 Morph 轨道。每条轨道都有静音、独奏、锁定、独立的效果、不透明度和混合模式。拖动轨道标题即可移动轨道。"
shot_alt = "DROP 标记处的时间线特写：一个嵌套片段就地展开，它自己的文字、视频和音频轨道显示在主轨道之间，实例以外的部分在两侧变暗；视频片段上有胶片条，音频轨道上有波形。"
shot_cap = "片段 STINGER 在剪辑中段展开。片段在本实例以外的部分变暗显示。"
cut_title = "切分与修剪"
cut_body = "<kbd>S</kbd> 在播放头处切分。拖动事件的边缘即可修剪。"
region_title = "区间"
region_body = "<kbd>I</kbd> 和 <kbd>O</kbd> 设定区间。区间可以复制、删除、从它跨过的所有事件中剪掉、循环播放和渲染。"
snap_title = "吸附"
snap_body = "事件会吸附到其他事件的边缘、标记、区间边界、播放头和零点。拖动时按住 <kbd>Ctrl</kbd> 可关闭吸附。"
marker_title = "标记"
marker_body = "<kbd>M</kbd> 添加标记并打开名称输入框。标记可以沿标尺拖动，也能被搜索到。"
reels_title = "片段"
reels_body = "选中的内容可以合成一个片段，并可任意多次使用；修改片段会作用于所有副本。<kbd>Enter</kbd> 在时间线上展开片段。发布的参数让每个副本有自己的取值。"
fades_title = "淡入淡出与交叉溶解"
fades_body = "拖动事件的上角即可设置淡入或淡出。把一个事件拖到另一个上面就得到交叉溶解。不透明度和音量在事件上各有一条电平线。"
find_title = "搜索"
find_body = "<kbd>Ctrl</kbd>+<kbd>F</kbd> 按名称搜索媒体、事件、标记、轨道和面板分组。<kbd>Ctrl</kbd>+<kbd>L</kbd> 跳转到输入的时间码。"
undo_title = "撤销"
undo_body = "任何更改都可以撤销，包括变形器和烘焙。一次拖动就是一步撤销。"

[playback]
title = "播放"
standfirst = "音频是主时钟，画面跟随音频，因此在很长的时间线上音画也不会错位。"
speed_title = "速度条"
speed_body = "上方的速度条设定 −2× 到 +2× 的恒定速度。下方是穿梭条，松开后回到零；拖过末端可达 ±8×。双击任一速度条恢复为 1×。"
space_title = "按住空格"
space_body = "按住 <kbd>Space</kbd>，播放在五秒内加速到 4×；松开后减速。短按为播放或暂停，连按两下停在区间起点。"
reverse_title = "倒放"
reverse_body = "负速度会逐帧准确地倒放画面和声音。也可以在事件属性中把事件设为倒放。"
loop_title = "循环"
loop_body = "区间循环时没有间隙：区间开头常驻缓存。"
meters_title = "电平表"
meters_body = "分段电平表采用分贝刻度并保持峰值，主推子以 dB 显示。暂停时拖动浏览，电平表显示光标处的电平。"
detach_title = "第二台显示器"
detach_body = "双击预览即可在单独窗口中打开。关闭该窗口，预览回到原位。"

[effects]
title = "效果"
standfirst = "效果以链的形式加在事件或轨道上。槽位可以重新排序和关闭，预览立即更新，导出运行的是同一套代码。任何效果链都可以保存为预设。"
fx_cap = "26 种视频效果。效果库在所选事件的一帧上预览每种效果。"
shot_alt = "打开效果选择器的视频效果窗口：搜索框、带片段实时缩略图的预设，以及按类别分组的效果，每种效果都有自己的缩略图条。"
audio_title = "音频"
list_title = "18 种音频效果"
list_body = "Gain、Slowed+Reverb、Pitch Shift、Filter、EQ、Distortion、Bitcrusher、Tremolo、AutoPan、Vibrato、Chorus、Flanger、Phaser、Delay、Compressor、Gate、Limiter、Stereo Width。音乐轨道上的压缩器可以在有人声时压低音乐。"
slowed_title = "Slowed+Reverb"
slowed_body = "放慢素材并随之降低音调，再加上可调延迟、衰减、阻尼和湿声电平的混响。用在视频事件上时，画面也会一起放慢。"
note = "任何效果、转场和字幕的任何参数都能用曲线自动化。自动化关键帧绑定在源素材上：修剪事件不会移动它们。混响尾音会延续到事件结束之后。"
shot2_alt = "一个片段的音频效果窗口：Slowed+Reverb 参数，下方是带有 rate 和 mix 关键帧曲线的自动化图表。"
shot2_cap = "Slowed+Reverb 的 rate 和 mix 曲线。点可以拖动，包络可以复制到另一个事件。"

[more]
title = "转场、字幕、生成器"
transitions_title = "33 种转场"
transitions_body = "划像、光圈、时钟、推移、滑入、缩放、旋转、甩镜、百叶窗、立方体、翻页、故障、胶片灼烧、漏光等。它们的参数和效果参数一样可以自动化。"
titles_title = "字幕"
titles_body = "提供人名条、标题、打字机、滚动字幕和片尾字幕等预设。字体、对齐、填充、描边、阴影和底板都可以逐个设置。"
generators_title = "生成器"
generators_body = "纯色、渐变、形状、倒计时片头和测试信号。"

[morpher]
title = "变形器"
standfirst = "变形器位于自己的轨道上，在其持续时间内改变它下方的事件：应用一批效果、替换源素材，或两者同时进行。它有淡入淡出和强度控制，还可以烘焙进事件。"
shot_alt = "变形器的特效批次编辑器：作用于固定的六个片段，把源素材替换与 VHS、Glow 串成链，设置带淡入淡出的强度，选择新的源文件，并提供烘焙和删除。"
shot_cap = "六个目标事件：先替换源素材，再加 VHS 和 Glow。"
swap_title = "替换源素材"
swap_body = "替换目标事件的源素材，例如把原始素材换成调色后的母版，或把所有入点平移同样的量。剪切点、时长和位置都不变。"
batch_title = "效果批次"
batch_body = "效果批次追加到每个目标事件的效果链末尾，立即生效，无需渲染。"
delete_title = "删除"
delete_body = "变形器不修改目标事件本身，因此删除变形器后剪辑恢复原状。"
bake_title = "烘焙"
bake_body = "烘焙把变形器写入事件并将其移除；画面和声音保持不变。烘焙可以撤销。"

[bin]
title = "媒体面板"
standfirst = "导入的文件以卡片形式出现在面板中。缺失的文件以占位符打开，文件恢复后自动重新连接。"
shot_alt = "自由布局的媒体面板：素材、音乐和生成媒体各有命名分组，视频卡片显示代表帧和时长，音乐以波形显示，还有文字生成器。"
shot_cap = "分组名称写在边框的缺口处。<br>卡片显示代表帧、时长或波形。"
poster_title = "缩略图"
poster_body = "视频卡片显示文件中有代表性的一帧，而不是第一帧。"
scrub_title = "悬停浏览"
scrub_body = "鼠标划过卡片时会播放该文件。"
wave_title = "波形"
wave_body = "音频卡片显示文件的波形。"
groups_title = "分组"
groups_body = "卡片可以分组、命名和锁定。分组整体移动。"
layout_title = "布局"
layout_body = "自由布局或网格。排列方式随项目保存。"
drag_title = "拖到时间线"
drag_body = "拖动卡片时，时间线会显示事件轮廓、目标轨道和吸附线。"

[export]
title = "导出"
standfirst = "MP4：H.264 视频，AAC 48 kHz 立体声，faststart。如果设定了区间，只渲染该区间。"
shot_alt = "渲染设置：视频编码器为自动并优先使用硬件，CRF 质量，音频码率，分辨率取自项目，AAC 48 kHz 立体声，带 faststart 的 MP4 容器。"
shot_cap = "渲染设置：编码器、质量、音频和容器。"
encoder_title = "编码器选择"
encoder_body = "自动模式下依次尝试硬件编码器，每个都先打开再使用；打不开的会被跳过。也可以手动选择编码器。"
quality_title = "质量"
quality_body = "CRF 或目标码率，音频 128 到 320 kbps，项目分辨率或最高 4K 的任意尺寸。"
progress_title = "进度"
progress_body = "渲染窗口显示当前阶段、剩余时间以及相对实时的速度。渲染可以暂停或取消。"
inproc_title = "无中间文件"
inproc_body = "编码和封装在编辑器进程内完成，不写临时文件。"
cli_title = "kt-cli"
cli_body = "命令行工具无需窗口即可渲染和导出项目文件。"

[care]
title = "保存与恢复"
autosave_title = "自动保存"
autosave_body = "项目有改动时每 30 秒保存一次，但拖动和播放时不保存。文件以原子方式写入，崩溃不会留下写了一半的项目。"
readable_title = "项目文件"
readable_body = "项目是一个 JSON 文件，媒体使用相对路径，因此复制或移动文件夹后仍可使用。视图、轨道名称和面板布局都保存在其中。"
cache_title = "缓存"
cache_body = "波形和缩略图保存在项目旁的一个文件中。删除该文件或源文件发生变化时，只重建受影响的数据。"
warnings_title = "诊断"
warnings_body = "诊断窗口显示缓存占用以及已显示与丢弃的帧数。解码跟不上播放时会弹出通知。"

