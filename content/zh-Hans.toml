# Kinetren 落地页 — 简体中文。尚未翻译：下面的值都还是英文。
# 页面照常生成，但会带上 noindex，并且在翻译完成前不进入 sitemap
# （由 build.py 自动判断）。
#
# The key set and order are defined by en.toml. Markup in values: <em> <strong> <kbd> <code> <br>.
# [lang] is not translated — these lines are identical in every catalog.

[site]
tagline = "A non-linear video editor for Linux where the preview is the render — what you hear in the edit is the file you ship."
