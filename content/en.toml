# The hero headline. l1 is the <h1>: the only line search engines and screen
# readers get. The page shows the others in turn, in the same place.
# These are the page's slogans and calls to action (owner, 2026-10-27): what a
# visitor gets and why to download — not internal facts retold as slogans
# ("the preview is the export" reads as 2+2=4). Each must still be true of
# kinetren: no promise the editor does not keep.
[headline]
l1 = "A free video editor <em>for Linux and Windows</em>"
l2 = "Finally, proper editing <em>on Linux</em>"
l3 = "Made for edits: <em>Slowed+Reverb, VHS, Glow</em>"
l4 = "Edit. Export. <em>Post.</em>"
l5 = "Download now, <em>edit in a minute</em>"

[hero]
eyebrow = "Video editor · Linux · Windows"
lede = "Multi-track timeline with real-time preview, nested reels, 33 transitions, 29 video and 18 audio effects, curve automation on every parameter, titles and generators. Export to MP4, MOV, MKV or WebM renders what the preview shows."
cta_secondary = "Features"
shot_alt = "The kinetren window during playback: the media bin on the left with footage, music and generated titles in named groups, the preview in the centre with a reel's title and a tilted picture over a shot with chromatic aberration and glow, live level meters beside it, and a multi-track timeline below with named markers, titles, video, camera, music and a morpher track."

# The download panel, shown in the hero and in the "Download" section. A
# visitor on Windows or Linux sees the button of their system and the other
# build as a small link (other_*); anyone else sees both buttons and the
# systems line.
