[why]
title = "Rendering"
ship_title = "One code path"
ship_body = "The preview and the MP4 export are composited by the same code. The exported frame is the frame shown in the preview."
same_title = "Repeatable output"
same_body = "Rendering the same project twice on the same machine produces identical files, whatever was played or scrubbed in between."
stall_title = "Scrolling does not decode video"
stall_body = "Waveforms, filmstrips and thumbnails are read from an index built once per file. Scrolling and zooming the timeline use only that index."
gpu_title = "Hardware encoding"
gpu_body = "NVIDIA, AMD and Intel encoders are detected automatically, with a software encoder as the fallback. Export writes no temporary files."

[edit]
title = "Timeline"
standfirst = "Video, audio and morph tracks. Each track has mute, solo, lock, its own effects, opacity and blend mode. Drag a track header to move the track."
shot_alt = "Timeline close-up at the DROP marker: a nested reel opened in place, its own text, video and audio tracks shown between the main tracks with the parts outside the instance veiled on both sides; filmstrips along video clips and waveforms on the audio tracks."
shot_cap = "The reel STINGER expanded in the middle of the edit. The parts of the reel outside this instance are veiled."
cut_title = "Split and trim"
cut_body = "<kbd>S</kbd> splits at the playhead. Drag an edge of an event to trim it."
region_title = "Region"
region_body = "<kbd>I</kbd> and <kbd>O</kbd> set the region. It can be copied, deleted, cut out of every event it crosses, looped and rendered."
snap_title = "Snapping"
snap_body = "Events snap to event edges, markers, region bounds, the playhead and zero. Hold <kbd>Ctrl</kbd> while dragging to turn snapping off."
marker_title = "Markers"
marker_body = "<kbd>M</kbd> adds a marker and opens its name field. Markers can be dragged along the ruler and are found by search."
reels_title = "Reels"
reels_body = "Collapse a selection into a reel and use it any number of times; changes to the reel apply to every copy. <kbd>Enter</kbd> expands a reel on the timeline. Published parameters give each copy its own values."
fades_title = "Fades and crossfades"
fades_body = "Drag the top corners of an event to fade it in or out. Drag one event over another for a crossfade. Opacity and volume have a level line on the event."
find_title = "Search"
find_body = "<kbd>Ctrl</kbd>+<kbd>F</kbd> searches media, events, markers, tracks and bin groups by name. <kbd>Ctrl</kbd>+<kbd>L</kbd> jumps to a typed timecode."
undo_title = "Undo"
undo_body = "Every change can be undone, including morphers and bakes. One drag is one undo step."

[playback]
title = "Playback"
standfirst = "Audio is the master clock and the picture follows it, so picture and sound stay in sync on long timelines."
speed_title = "Speed bars"
speed_body = "The upper bar sets a constant speed from −2× to +2×. The lower bar is a shuttle that returns to zero when released; dragging past its end goes up to ±8×. Double-click either bar to reset it to 1×."
space_title = "Holding Space"
space_body = "Hold <kbd>Space</kbd> and playback accelerates to 4× over five seconds; release it to slow down. Tap to play or pause, tap twice to stop at the start of the region."
reverse_title = "Reverse"
reverse_body = "Negative speed plays picture and sound backwards, frame-accurate. An event can also be reversed in its properties."
loop_title = "Loop"
loop_body = "The region loops without a gap: its start is kept in the cache."
meters_title = "Level meters"
meters_body = "Segmented meters on a decibel scale with peak hold, and a master fader in dB. While paused, scrubbing shows the level at the cursor."
detach_title = "Second monitor"
detach_body = "Double-click the preview to open it in a separate window. Closing the window returns the preview to the layout."

[effects]
title = "Effects"
standfirst = "Effects are chained on an event or on a track. Slots can be reordered and switched off, the preview updates immediately, and export runs the same code. Any chain can be saved as a preset."
fx_cap = "26 video effects. The gallery previews each one on a frame of the selected event."
shot_alt = "The video effects window with the effect picker open: a search field, presets with live thumbnails of the clip, and effects grouped by category, each with its own strip of thumbnails."
audio_title = "Audio"
list_title = "18 audio effects"
list_body = "Gain, Slowed+Reverb, Pitch Shift, Filter, EQ, Distortion, Bitcrusher, Tremolo, AutoPan, Vibrato, Chorus, Flanger, Phaser, Delay, Compressor, Gate, Limiter, Stereo Width. A compressor on a music track can duck it under speech."
slowed_title = "Slowed+Reverb"
slowed_body = "Slows the material down with the pitch falling and adds reverb with delay, decay, damping and wet level. On a video event it slows the picture too."
note = "Every parameter of every effect, transition and title can be automated with curves. Automation keys are tied to the source material: trimming an event does not move them. The reverb tail continues past the end of the event."
shot2_alt = "The audio effects window for one clip: Slowed+Reverb parameters, and below them the automation graph with keyframed curves for rate and mix."
shot2_cap = "Rate and mix curves of Slowed+Reverb. Points can be dragged, and an envelope can be copied to another event."

[more]
title = "Transitions, titles, generators"
transitions_title = "33 transitions"
transitions_body = "Wipes, iris, clock, push, slide, zoom, spin, whip pan, blinds, cube, page peel, glitch, film burn, light leaks and others. Their parameters can be automated like effect parameters."
titles_title = "Titles"
titles_body = "Presets for lower thirds, headlines, typewriter, crawl and end credits. Font, alignment, fill, stroke, shadow and backing are set per title."
generators_title = "Generators"
generators_body = "Solid colours, gradients, shapes, a countdown leader and test signals."

[morpher]
title = "Morpher"
standfirst = "A morpher sits on its own track and changes the events under it for as long as it lasts: it applies an effect batch, swaps the source, or both. It has fades, a strength control, and can be baked into the events."
shot_alt = "The morpher FX batch editor: it acts on a frozen list of six clips, chains a source swap with VHS and Glow, sets strength with fade-in and fade-out, picks the new source file, and offers bake and delete."
shot_cap = "Six target events: a source swap, then VHS and Glow."
swap_title = "Source swap"
swap_body = "Replaces the source of the target events, for example rushes with the graded master, or shifts every in-point by the same amount. Cuts, durations and positions do not change."
batch_title = "Effect batch"
batch_body = "The batch is appended to the effect chain of every target event and applies live, without rendering."
delete_title = "Deleting"
delete_body = "The target events are not modified, so deleting the morpher returns the edit to its previous state."
bake_title = "Bake"
bake_body = "Baking writes the morpher into the events and removes it; picture and sound stay identical. Baking can be undone."

[bin]
title = "Media bin"
standfirst = "Imported files appear in the bin as cards. Missing files open as placeholders and reconnect when the files are back."
shot_alt = "The media bin in free layout: named groups for footage, music and generated media, video cards with poster frames and durations, music drawn as waveforms, and text generators."
shot_cap = "Groups are named in a break in their frame.<br>Cards show a poster frame, the duration or a waveform."
poster_title = "Thumbnails"
poster_body = "A video card shows a representative frame of the file instead of its first frame."
scrub_title = "Scrubbing"
scrub_body = "Moving the mouse across a card plays through the file."
wave_title = "Waveforms"
wave_body = "Audio cards show the waveform of the file."
groups_title = "Groups"
groups_body = "Cards can be grouped, named and locked. A group moves as a whole."
layout_title = "Layout"
layout_body = "Free layout or grid. The arrangement is saved with the project."
drag_title = "Dragging to the timeline"
drag_body = "While a card is dragged, the timeline shows the event outline, the target track and the snap line."

[export]
title = "Export"
standfirst = "MP4: H.264 video, AAC 48 kHz stereo, faststart. If a region is set, only the region is rendered."
shot_alt = "Render settings: video codec on automatic with hardware encoders first, CRF quality, audio bitrate, resolution taken from the project, AAC 48 kHz stereo, MP4 container with faststart."
shot_cap = "Render settings: codec, quality, audio and container."
encoder_title = "Encoder selection"
encoder_body = "In automatic mode the hardware encoders are tried in turn, and each one is opened before it is used; one that fails to open is skipped. An encoder can also be chosen by hand."
quality_title = "Quality"
quality_body = "CRF or a target bitrate, audio from 128 to 320 kbps, the project resolution or any size up to 4K."
progress_title = "Progress"
progress_body = "The render window shows the phase, the remaining time and the speed relative to realtime. A render can be paused or cancelled."
inproc_title = "No intermediate files"
inproc_body = "Encoding and muxing run inside the editor process without writing temporary files."
cli_title = "kt-cli"
cli_body = "The command-line tool renders and exports a project file without a window."

[care]
title = "Saving and recovery"
autosave_title = "Autosave"
autosave_body = "Every 30 seconds if the project changed, but not during a drag or playback. Files are written atomically, so a crash cannot leave a half-written project."
readable_title = "Project files"
readable_body = "A project is a JSON file with relative paths to the media, so a copied or moved folder keeps working. The view, track names and bin layout are saved in it."
cache_title = "Cache"
cache_body = "Waveforms and thumbnails are stored in a file next to the project. If it is deleted or a source file changes, only the affected data is rebuilt."
warnings_title = "Diagnostics"
warnings_body = "The diagnostics window shows cache fill and shown versus dropped frames. When decoding cannot keep up with playback, a notification says so."

