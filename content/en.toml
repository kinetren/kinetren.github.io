[hero]
eyebrow = "Video editor · Linux · Windows"
h1 = "A free video editor <em>for Linux and Windows</em>"
lede = "Multi-track timeline with real-time preview, nested reels, 33 transitions, 26 video and 18 audio effects, curve automation on every parameter, titles and generators. Export to MP4 renders exactly what the preview shows."
cta_primary = "Download"
cta_secondary = "Features"
cta_note = "Linux x86_64 · Windows 10/11"
shot_alt = "The kinetren window during playback: the media bin on the left with footage, music and generated titles in named groups, the video preview in the centre with live level meters beside it, and a multi-track timeline below with named markers, titles, video, music and a morpher track."

[stats]
vfx = "video effects"
vfx_list = "Geometry · Mirror · Corner Pin · Blur · Sharpen · Radial Blur · Greenscreen · Drop Shadow · Edges · Noise · VHS · Event Grid · Vignette · Pixelate · Halftone · Glow · Pan 3D · Cylinder 3D · Color Grade · Duotone · Posterize · Chromatic Aberration · Lens Distort · Twirl · Ripple · Kaleidoscope"
afx = "audio effects"
