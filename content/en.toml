# kinetren landing — English. This file is the REFERENCE catalog: it defines
# the key set and its order, exactly as src/apps/kt-app/i18n/en.toml does for
# the editor. A key missing here is an error in every other language; a
# key present only elsewhere is an error too.
#
# Inline markup allowed in values: <em> <strong> <kbd> <code> <br>. Anything
# else is escaped. Move the emphasis wherever your language wants it.
# Product names are not translated: kinetren, MP4, H.264, AAC, FFmpeg, and the
# effect names (Pan, Blur, VHS, Slowed+Reverb, Morpher) — see i18n/README.md.
#
# Every sentence states a fact about the editor. No slogans, no "X, not Y"
# antitheses, no closing punchlines: if a sentence can be removed without
# losing a fact, remove it.

