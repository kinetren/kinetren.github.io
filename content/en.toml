[get]
title = "Download"
standfirst = "On Linux, unpack the archive and run the installer: it installs into your home directory without root, adds kinetren to the applications menu and registers <code>.kt</code> project files. Once a day the program asks GitHub whether a newer release is out and says so in Notices; File → Preferences… switches the check off."
c_install = "Linux: unpack and install"
c_render = "or render from a terminal"
system_label = "Linux"
system_value = "x86_64, glibc 2.35 or newer — Ubuntu 22.04+, Debian 12+, Fedora 36+"
windows_label = "Windows"
windows_value = "Windows 10 or 11, x86_64. A portable zip, nothing is installed. On the first start kinetren finds a shared FFmpeg 6, 7, 8 or 9 or offers to download one."
gpu_label = "Graphics"
gpu_value = "A driver with Vulkan, or with DirectX 12 on Windows. Without a graphics card, Mesa's software Vulkan driver (<code>mesa-vulkan-drivers</code>) runs every feature on the processor, more slowly. With no such driver there is no picture and no render."
video_label = "Video"
video_value = "FFmpeg 6, 7, 8 or 9. On Linux the system one is used, with whatever hardware acceleration it was built with."
sound_label = "Sound"
sound_value = "ALSA or PipeWire on Linux, WASAPI on Windows. Devices at 44.1 kHz or with 5.1 and 7.1 channels are converted at the output."
installs_label = "Installs to"
installs_value = "<code>~/.local</code> — binaries, icons, desktop entry and the <code>.kt</code> project type"
