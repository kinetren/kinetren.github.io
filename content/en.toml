[roadmap]
title = "Roadmap"
shipped_title = "Versions"
next_title = "Planned"
v261025 = "Windows: when the graphics card cannot run the effects, including in a virtual machine without a graphics driver, rendering falls back to the CPU with a notice. Windows and Linux export the same picture."
v261024 = "Windows build: a portable zip. FFmpeg 6, 7 or 8 is found on the system or downloaded on the first start."
v261022 = "The editor is renamed kinetren. Release builds in Docker, anonymous usage statistics that can be switched off, documentation in English."
v261003 = "Own project format <code>.kt</code>. Projects from earlier versions open through import."
v260926 = "Music ducking under speech works as a sidechain compressor. Still images on the timeline. Geometry handles in the preview."
v260922 = "Reels publish parameters, so each copy has its own values. Automation curves get segment shapes and formulas."
v260917 = "Effect gallery with previews on the event's own frame, effect presets, animated title presets."
v260916 = "33 transitions. Titles and generators."
v260915 = "Nested reels. Project lock and recovery after a crash."
v260914 = "14 new audio and 16 new video effects."
v260907 = "Slowed+Reverb slows the picture together with the sound."
v260906 = "Transitions between events, 16 kinds. One automation editor with a graph and a table."
v260904 = "GPU rendering. Keyframe automation for video effect parameters."
v260829 = "Interface in five languages: English, Spanish, Simplified Chinese, Arabic and Russian."
v260827 = "Media bin with free layout and grid. File, Edit and View menus. The hint line at the bottom of the window."
v260824 = "FFmpeg 6, 7 or 8 loaded at runtime. MP4 export inside the editor with automatic hardware encoder choice. The morpher."
v260822 = "Rewrite in Rust: audio engine, undo, project format, background decoding."
n_formats = "More export formats: H.265, VP9/WebM, ProRes and image sequences"
n_loudness = "Loudness check in the render window with target levels for each platform and per-channel readings"
n_vcheck = "Picture check after export: overexposed, black and frozen frames, letterboxing"
n_crashsafe = "An encoder crash during export does not close the editor"
n_genpick = "Previews in the generator and transition pickers, more generators, generators with sound"
n_ripple = "Ripple editing, closing gaps and cutting out a region with one key"
n_freeze = "Freeze frame as a single command"
n_notes = "Multi-line notes on the timeline"
n_keys = "Selecting and moving several automation keys at once"
n_presets = "Presets for curves, effect chains and transitions"
n_windows = "Effect windows that can be moved out of the main window, like the preview"
n_center = "Picking effect centres by clicking in the preview"
n_colour = "Colour correction: curves, LUTs and scopes"
n_denoise = "Audio noise reduction"
n_ducking = "Automatic music ducking under titles and speech sections"
n_speech = "Speech transcription: search by spoken text, pause detection"
n_multicam = "Multicam editing"
n_layouts = "Interface layouts: pick one on the first start, save your own"
n_plugins = "Plugins for effects and generators, OpenFX support"
n_smart = "Smart render: already encoded parts are reused"
n_lens = "Lens effects: dirt, drops, flares"
n_midi = "MIDI controllers and HDR10"
n_packages = "deb, rpm, AppImage and Flatpak packages"

[get]
title = "Download"
standfirst = "Builds for Linux and Windows are on the releases page. On Linux, unpack the archive and run the installer: it installs into your home directory without root, adds kinetren to the applications menu and registers <code>.kt</code> project files."
c_install = "Linux: unpack and install"
c_render = "or render from a terminal"
cta = "Download from GitHub"
cta_note = "Linux · Windows"
system_label = "Linux"
system_value = "x86_64, glibc 2.35 or newer — Ubuntu 22.04+, Debian 12+, Fedora 36+"
windows_label = "Windows"
windows_value = "Windows 10 or 11, x86_64. A portable zip, nothing is installed. On the first start kinetren finds a shared FFmpeg 6, 7 or 8 or offers to download one."
gpu_label = "Graphics"
gpu_value = "Any driver with Vulkan or OpenGL. Without a GPU the CPU is used."
video_label = "Video"
video_value = "FFmpeg 6, 7 or 8. On Linux the system one is used, with whatever hardware acceleration it was built with."
sound_label = "Sound"
