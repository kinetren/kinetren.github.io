[why]
title = "Rendering"
ship_title = "One code path"
ship_body = "The preview and the export are composited by the same engine on the graphics device; without a graphics card it runs on the processor through Vulkan. The exported frame is the frame shown in the preview."
same_title = "Repeatable output"
same_body = "Rendering the same project twice on the same machine produces identical files, whatever was played or scrubbed in between. The sound is identical on Linux and Windows and on any processor, the picture on the same graphics device."
stall_title = "Scrolling does not decode video"
stall_body = "Waveforms, filmstrips and thumbnails are read from an index built once per file. Scrolling and zooming the timeline use only that index."
gpu_title = "Hardware encoding"
gpu_body = "NVIDIA, AMD and Intel encoders are detected automatically, with a software encoder as the fallback. If the graphics driver fails while a hardware encoder is tried, a render on automatic moves on to the next encoder and the program stays open. Export writes no temporary files."

[edit]
title = "Timeline"
standfirst = "Video, audio, morph and camera tracks. Each track has mute, solo, lock, its own effects, opacity and blend mode. Drag a track header to move the track."
shot_alt = "Timeline close-up at the DROP marker: a nested reel opened in place, its own text, video and audio tracks shown between the main tracks with the parts outside the instance veiled on both sides; filmstrips along video clips and waveforms on the audio tracks."
shot_cap = "The reel STINGER expanded in the middle of the edit. The parts of the reel outside this instance are veiled."
cut_title = "Split and trim"
cut_body = "<kbd>S</kbd> splits at the playhead. Drag an edge of an event to trim it."
freeze_title = "Freeze frame"
freeze_body = "Insert frame hold (freeze frame) in an event's right-click menu holds the picture at the playhead for 2 seconds, then goes on from the same frame. The event keeps its length."
region_title = "Region"
region_body = "<kbd>I</kbd> and <kbd>O</kbd> set the region; a triple click on an event sets it over the event. It can be copied, deleted, looped and rendered. <kbd>C</kbd> cuts the region out of every event it crosses and leaves the rest in place."
snap_title = "Snapping"
snap_body = "Events snap to event edges, markers, region bounds, the playhead and zero. Hold <kbd>Ctrl</kbd> while dragging to turn snapping off."
marker_title = "Markers"
marker_body = "<kbd>M</kbd> adds a marker and opens its name field. A click on a marker puts the playhead on it. Markers can be dragged along the ruler and are found by search. Note… in a marker's right-click menu adds a multi-line note; it is shown in the status line and exported to OpenTimelineIO as a marker comment."
reels_title = "Reels"
reels_body = "Collapse a selection into a reel and use it any number of times; changes to the reel apply to every copy. <kbd>Enter</kbd> expands a reel on the timeline. Published parameters give each copy its own values."
fades_title = "Fades and crossfades"
fades_body = "Drag the top corners of an event to fade it in or out. Drag one event over another for a crossfade. Opacity and volume have a level line on the event; the volume goes down to mute, and a changed level is written after the event's name."
find_title = "Search"
find_body = "<kbd>Ctrl</kbd>+<kbd>F</kbd> searches media, events, markers, tracks and bin groups by name. <kbd>Ctrl</kbd>+<kbd>L</kbd> jumps to a typed timecode."
styles_title = "Layout & Controls style"
styles_body = "On the first start, or in File → Preferences…, the keys, the mouse wheel and the panels can follow VEGAS, Premiere Pro, DaVinci Resolve, Final Cut Pro or After Effects. Customize changes any key, and a settings code restores the setup after a reinstall."
undo_title = "Undo"
undo_body = "Every change can be undone, including morphers and bakes. One drag is one undo step."

[playback]
title = "Playback"
standfirst = "Audio is the master clock and the picture follows it, so picture and sound stay in sync on long timelines."
speed_title = "Speed bars"
speed_body = "The upper bar sets a constant speed from −2× to +2×; right-click it to type any speed up to 8×. The lower bar is a shuttle that returns to zero when released; dragging past its end goes up to ±8×. Double-click either bar to reset it to 1×."
space_title = "Space and arrows"
space_body = "A tap plays or pauses, two taps stop at the start of the region. Held during playback, <kbd>Space</kbd> speeds up to 4× over five seconds; held from a pause, it plays only while held. <kbd>Ctrl</kbd>+<kbd>Space</kbd> plays backward while held. <kbd>←</kbd> and <kbd>→</kbd> step one frame."
reverse_title = "Reverse"
reverse_body = "Negative speed plays picture and sound backwards, frame-accurate. An event can also be reversed in its properties."
loop_title = "Loop"
loop_body = "The region loops without a gap. Picture and sound are kept after the effects as first played, so a loop over heavy effects plays at the project's frame rate from the third lap. Parts too slow for real time are finished in the background while the program is idle and kept on disk, up to 2 GB, when the graphics card has a video encoder."
meters_title = "Level meters"
meters_body = "Segmented meters on a decibel scale with peak hold, and a master fader in dB. While paused, scrubbing shows the level at the cursor."
detach_title = "Second monitor"
detach_body = "Double-click the preview to open it in a separate window. Closing the window returns the preview to the layout."

[effects]
title = "Effects"
standfirst = "Effects are chained on an event or on a track and shown as a node graph in the order they run; a video event and its linked sound share one graph. Nodes can be dragged to reorder and switched off, the preview updates immediately, and export runs the same code. <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+click on a node shows the picture after that effect. Every colour has an eyedropper that takes a colour from anywhere in the program. Any chain can be saved as a preset."
fx_cap = "29 video effects. The gallery previews each one on a frame of the selected event."
shot_alt = "The effect picker scrolled to the end of its gallery: 3D, colour and distortion effects, then Camera ISP and VHS Tape, each with thumbnails of its presets on the event's own frame."
audio_title = "Audio"
list_title = "18 audio effects"
list_body = "Gain, Slowed+Reverb, Pitch Shift, Filter, EQ, Distortion, Bitcrusher, Tremolo, AutoPan, Vibrato, Chorus, Flanger, Phaser, Delay, Compressor, Gate, Limiter, Stereo Width. A compressor on a music track can duck it under speech."
slowed_title = "Slowed+Reverb"
slowed_body = "Slows the material down with the pitch falling and adds reverb with delay, decay, damping and wet level. On a video event it slows the picture too."
note = "Every parameter of every effect, transition and title can be automated with curves; several keys can be selected and moved together. Automation keys are tied to the source material: trimming an event does not move them. The reverb tail continues past the end of the event."
shot2_alt = "The audio effects window for one clip: Slowed+Reverb parameters, and below them the automation graph with keyframed curves for rate and mix."
shot2_cap = "Rate and mix curves of Slowed+Reverb. Points can be dragged, and an envelope can be copied to another event."
sim_title = "Simulations"
sim_body = "Three effects of the Simulation category model the device and its process, and the look follows from the causes. Their noise and defects are the same on every play, seek and render. On an event with linked audio, each also processes the sound; its switch is in the audio's chain."
g_fx_datamosh_alt = "Two versions of one night frame of a city, side by side: on the left as shot, on the right with Datamosh, where the city's motion drags the hillside of the previous shot across the picture."
g_fx_datamosh_cap = "Datamosh, Cut mosh preset, right after a cut. Left: the frame as shot. Right: the dropped keyframe lets the new shot's motion drag the previous shot."
g_fx_datamosh_body = "Datamosh runs its own video codec over the clip and breaks it: dropped keyframes, repeated motion, borrowed motion vectors, with curves and Reset keys. The sound goes through an audio codec in the same stream: a dropped keyframe takes its audio packet with it, and a Reset key heals both."
g_fx_camera_isp_alt = "Two versions of one night aerial frame of a lit tower, side by side: on the left as shot, on the right through Camera ISP with the Phone at night look, covered in coloured sensor noise and denoiser smear."
g_fx_camera_isp_cap = "Camera ISP, Phone at night look. Left: the source frame. Right: sensor noise, the denoiser's smear and the phone's tone curve."
g_fx_camera_isp_body = "The effect turns the frame back into a scene and films it again through a lens, a colour mosaic, a sensor and the camera's processor; every block can be switched off or set wrong, and View shows any stage. Its looks also set the device's microphone: the acoustic port, wind, automatic gain control, noise suppression and the codec."
g_fx_vhs_tape_alt = "The VHS Tape effects window with the drawn drum and its two heads, head A set to Chipped, the PAL, SP, one deck and two heads switches, and beside it the frame played back from the tape with a streak of dropouts."
g_fx_vhs_tape_cap = "VHS Tape: the deck panel with head A set to Chipped, and the frame the tape plays back."
g_fx_vhs_tape_body = "The picture is recorded to a modelled tape and read back; click a head on the drum to make it dirty, clogged or chipped, and switch SP/LP/EP, 2 or 4 heads, TBC or two decks. The sound plays from the same deck: Hi-Fi tracks that crackle where a head breaks the picture, or the linear track with hiss and flutter."
g_masks_alt = "A night city on the preview with a Pen mask drawn around the skyline: the solid outline with its points, the dashed feather line outside it, and a blue Duotone tint only inside the mask."
g_masks_cap = "A Pen mask with its points and feather; a Duotone tints only the skyline inside it."
masks_title = "Masks"
masks_body = "Rectangle, ellipse and Bézier pen, drawn on the preview. A mask cuts the event's picture, limits one effect or cuts a whole track. Each has feather, expansion, opacity, invert and a mode (Add, Subtract, Intersect, Difference); several masks combine from the top down, and the shape can be keyed over time."

[more]
title = "Transitions, titles, generators"
transitions_title = "33 transitions"
transitions_body = "Wipes, iris, clock, push, slide, zoom, spin, whip pan, blinds, cube, page peel, glitch, film burn, light leaks and others. Their parameters can be automated like effect parameters. The Kind field shows every kind as a picture of the cut halfway through."
titles_title = "Titles"
titles_body = "Presets for lower thirds, headlines, typewriter, crawl and end credits. Font, alignment, fill, stroke, shadow and backing are set per title. The text can be typed, or be a running timecode, stopwatch or countdown."
generators_title = "Generators"
generators_body = "Solid colours, gradients, shapes, moving backgrounds, a countdown leader and test signals. The shapes include polygon, star, arrow, border frame, lower-third plate and progress bar; the moving backgrounds are moving gradient, plasma, particles and pattern. Sync flash puts a flash and a beep on the same frame, and Safe areas draws the action-safe and title-safe frames. Sound generators on an audio track: tone, audio noise, sine sweep, beep train and silence."

[morpher]
title = "Morpher"
standfirst = "A morpher sits on its own track and changes the events under it for as long as it lasts: it applies an effect batch, swaps the source, or both. It has fades, a strength control, and can be baked into the events."
shot_alt = "The morpher FX batch editor: it acts on a frozen list of six clips, chains a source swap with VHS Tape, sets strength with fade-in and fade-out, picks the new source file, and offers bake and delete."
shot_cap = "Six target events: a source swap, then VHS Tape."
swap_title = "Source swap"
swap_body = "Replaces the source of the target events, for example rushes with the graded master, or shifts every in-point by the same amount. Cuts, durations and positions do not change."
batch_title = "Effect batch"
batch_body = "The batch can hold video and audio effects. It is appended to the effect chain of every target event and applies live, without rendering. For VHS Tape, Datamosh and Camera ISP the sound half stands next to the picture half, and either can be switched off for the layer."
delete_title = "Deleting"
delete_body = "The target events are not modified, so deleting the morpher returns the edit to its previous state."
bake_title = "Bake"
bake_body = "Baking writes the morpher into the events and removes it; picture and sound stay identical. Baking can be undone."

[bin]
title = "Media bin"
standfirst = "Imported files appear in the bin as cards. Missing files open as placeholders and reconnect when the files are back."
shot_alt = "The media bin in free layout: named groups for footage, music and generated media, video cards with poster frames and durations, music drawn as waveforms, and text generators."
shot_cap = "Groups are named in a break in their frame.<br>Cards show a poster frame, the duration or a waveform."
poster_title = "Thumbnails"
poster_body = "A video card shows a representative frame of the file instead of its first frame."
scrub_title = "Scrubbing"
scrub_body = "Moving the mouse across a card plays through the file and shows the file's time at the cursor."
wave_title = "Waveforms"
wave_body = "Audio cards show the waveform of the file."
groups_title = "Groups"
groups_body = "Cards can be grouped, named and locked. A group moves as a whole."
layout_title = "Layout"
layout_body = "Free layout or grid. The arrangement is saved with the project."
drag_title = "Dragging to the timeline"
drag_body = "A card dragged to a track lands with the scrubbed moment under the mouse; <kbd>Alt</kbd> puts the file's start there, <kbd>Alt</kbd>+<kbd>Shift</kbd> its end. Before the drop, the outline on the track shows the file's length and position."

[export]
title = "Export"
standfirst = "MP4, MOV, MKV or WebM; H.264, H.265, AV1, VP9 or ProRes 422 HQ video; AAC, Opus, PCM or FLAC sound at 48 kHz stereo. With a region set, either the region or the whole project is rendered."
shot_alt = "Render settings: video codec on automatic with hardware encoders first, CRF quality, audio bitrate, resolution taken from the project, AAC 48 kHz stereo, MP4 container with faststart."
shot_cap = "Render settings: codec, quality, audio and container."
encoder_title = "Encoder selection"
encoder_body = "In automatic mode the hardware encoders of the chosen codec are tried in turn, and each one is opened before it is used; one that fails to open is skipped. An encoder can also be chosen by hand. A choice the installed FFmpeg or the container cannot take is shown greyed with the reason."
quality_title = "Quality"
quality_body = "Constant quality, an average bitrate with a maximum, or a constant bitrate; encoder speed, keyframe interval, B-frames, 8 or 10 bits, BT.601 or BT.709 with limited or full range; the project size, a preset size up to 2160p or a custom one; the frame rate. Settings can be saved as presets kept between projects."
progress_title = "Progress"
progress_body = "The render window names the encoder before the first frame and shows the phase, the remaining time, the speed with a chart, the file size and the bitrate; its log goes to the telemetry journal. Once the range has been played, it predicts the render time and compares the preview's size with the file's. At the end it gives the loudness of the result (LUFS, true peak) and opens the file or its folder. A render can be paused or cancelled. An existing file is replaced only after a question."
inproc_title = "No intermediate files"
inproc_body = "Encoding and muxing run inside the editor process without writing temporary files."
cli_title = "kt-cli"
cli_body = "The command-line tool renders and exports a project file with the render window's settings, without a window or a display."

[care]
title = "Saving and recovery"
autosave_title = "Autosave"
autosave_body = "Every 30 seconds, if the project changed, the edit is written to a recovery file next to the project; only <kbd>Ctrl</kbd>+<kbd>S</kbd> writes the project itself. During long playback the recovery file is written too. Files are written atomically, so a crash cannot leave a half-written project."
readable_title = "Project files"
readable_body = "A project is a JSON file with relative paths to the media, so a copied or moved folder keeps working, also between Linux and Windows. A path that is absolute on the other system opens as a placeholder. The view, track names and bin layout are saved in the project."
cache_title = "Cache"
cache_body = "Waveforms and thumbnails are stored in a file next to the project. If it is deleted or a source file changes, only the affected data is rebuilt."
warnings_title = "Diagnostics"
warnings_body = "The Diagnostics window shows how much memory the program holds and what it is made of, shown versus dropped frames and three graphs over time: playback, FFmpeg activity and the cache. The telemetry journal records playback, warnings and the user's actions with the clock time; <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>M</kbd> marks a moment in it. It stays on the computer. If the program crashes, a window names the part that faulted and offers Restore the project."

[roadmap]
title = "Roadmap"
shipped_title = "Versions"
next_title = "Planned"
