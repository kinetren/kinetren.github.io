[why]
title = "التصيير"
ship_title = "مسار تصيير واحد"
ship_body = "المعاينة والتصدير إلى MP4 يركّبان الإطار بالشيفرة نفسها. الإطار المُصدَّر هو الإطار الذي ظهر في المعاينة."
same_title = "نتيجة قابلة للتكرار"
same_body = "تصيير المشروع نفسه مرتين على الجهاز نفسه يعطي ملفين متطابقين، مهما شُغّل أو تُصفّح بينهما."
stall_title = "التمرير لا يفك ترميز الفيديو"
stall_body = "تُقرأ الأشكال الموجية وشرائط الإطارات والمصغرات من فهرس يُبنى مرة واحدة لكل ملف. التمرير والتكبير في الخط الزمني يستخدمان هذا الفهرس وحده."
gpu_title = "الترميز بالعتاد"
gpu_body = "تُكتشف مرمّزات NVIDIA وAMD وIntel تلقائيًا، ومرمّز برمجي بديل عند الحاجة. التصدير لا يكتب ملفات مؤقتة."

[edit]
title = "الخط الزمني"
standfirst = "مسارات فيديو وصوت وMorph. لكل مسار كتم وانفراد وقفل ومؤثراته الخاصة والعتامة ونمط المزج. يُنقل المسار بسحب رأسه."
shot_alt = "لقطة قريبة للخط الزمني عند العلامة DROP: بكرة متداخلة مفتوحة في مكانها، مساراتها الخاصة للنص والفيديو والصوت معروضة بين المسارات الرئيسية والأجزاء خارج النسخة معتمة من الجانبين، وشرائط الإطارات على مقاطع الفيديو والأشكال الموجية على مسارات الصوت."
shot_cap = "البكرة STINGER مفتوحة في وسط المونتاج. أجزاء البكرة خارج هذه النسخة معتمة."
cut_title = "القص والتشذيب"
cut_body = "<kbd>S</kbd> يقص عند المؤشر. يُشذَّب طرف الحدث بسحبه."
region_title = "المنطقة"
region_body = "<kbd>I</kbd> و<kbd>O</kbd> يحددان المنطقة. يمكن نسخها وحذفها وقصها من كل الأحداث التي تعبرها وتكرارها وتصييرها."
snap_title = "الالتقاط"
snap_body = "تلتقط الأحداث حواف الأحداث الأخرى والعلامات وحدود المنطقة والمؤشر والصفر. الضغط على <kbd>Ctrl</kbd> أثناء السحب يوقف الالتقاط."
marker_title = "العلامات"
marker_body = "<kbd>M</kbd> يضيف علامة ويفتح حقل اسمها. تُسحب العلامات على المسطرة ويعثر عليها البحث."
reels_title = "البكرات"
reels_body = "يُجمع التحديد في بكرة تُستخدم بأي عدد من المرات، وتسري تعديلات البكرة على كل النسخ. <kbd>Enter</kbd> يفتح البكرة على الخط الزمني. المعاملات المنشورة تعطي كل نسخة قيمها الخاصة."
fades_title = "التلاشي والذوبان المتقاطع"
fades_body = "يُضبط التلاشي بسحب الزاويتين العلويتين للحدث. سحب حدث فوق آخر يعطي ذوبانًا متقاطعًا. للعتامة ومستوى الصوت خط مستوى على الحدث."
find_title = "البحث"
find_body = "<kbd>Ctrl</kbd>+<kbd>F</kbd> يبحث بالاسم في الوسائط والأحداث والعلامات والمسارات ومجموعات اللوحة. <kbd>Ctrl</kbd>+<kbd>L</kbd> ينتقل إلى رمز زمني مكتوب."
undo_title = "التراجع"
undo_body = "يمكن التراجع عن أي تغيير، بما في ذلك المُحوّلات ودمجها. السحبة الواحدة خطوة تراجع واحدة."

[playback]
title = "التشغيل"
standfirst = "الصوت هو الساعة الرئيسية والصورة تتبعه، فلا تنفصل الصورة عن الصوت في الخطوط الزمنية الطويلة."
speed_title = "أشرطة السرعة"
speed_body = "الشريط العلوي يضبط سرعة ثابتة من −2× إلى +2×. الشريط السفلي مكوك يعود إلى الصفر عند تركه، والسحب بعد طرفه يصل إلى ±8×. النقر المزدوج على أي منهما يعيد السرعة إلى 1×."
space_title = "إبقاء المسافة مضغوطة"
space_body = "مع إبقاء <kbd>Space</kbd> مضغوطًا يتسارع التشغيل إلى 4× خلال خمس ثوانٍ، ويتباطأ عند تركه. الضغطة القصيرة تشغّل أو توقف مؤقتًا، والضغطتان المتتاليتان توقفان عند بداية المنطقة."
reverse_title = "التشغيل العكسي"
reverse_body = "السرعة السالبة تشغّل الصورة والصوت إلى الخلف بدقة الإطار. ويمكن أيضًا عكس الحدث من خصائصه."
loop_title = "التكرار"
loop_body = "تتكرر المنطقة بلا فجوة: بدايتها محفوظة في الذاكرة المؤقتة."
meters_title = "مقاييس المستوى"
meters_body = "مقاييس مقسّمة على تدريج بالديسيبل مع تثبيت القمة، ومُبهِت رئيسي بالـ dB. أثناء الإيقاف المؤقت يعرض المقياس المستوى تحت المؤشر عند التصفح."
detach_title = "شاشة ثانية"
detach_body = "النقر المزدوج على المعاينة يفتحها في نافذة مستقلة. إغلاق النافذة يعيد المعاينة إلى مكانها."

[effects]
title = "المؤثرات"
standfirst = "تُوضع المؤثرات في سلسلة على حدث أو على مسار. يمكن إعادة ترتيب الخانات وإيقافها، وتتحدث المعاينة فورًا، ويشغّل التصدير الشيفرة نفسها. يمكن حفظ أي سلسلة كإعداد مسبق."
fx_cap = "26 مؤثرًا للفيديو. يعرض المعرض كل مؤثر على إطار من الحدث المحدد."
shot_alt = "نافذة مؤثرات الفيديو ومنتقي المؤثرات مفتوح: حقل بحث، وإعدادات مسبقة بمصغرات حية للمقطع، ومؤثرات مجمّعة حسب الفئة لكل منها شريط مصغرات."
audio_title = "الصوت"
list_title = "18 مؤثرًا للصوت"
list_body = "Gain، Slowed+Reverb، Pitch Shift، Filter، EQ، Distortion، Bitcrusher، Tremolo، AutoPan، Vibrato، Chorus، Flanger، Phaser، Delay، Compressor، Gate، Limiter، Stereo Width. الضاغط على مسار الموسيقى يستطيع خفضها تحت الكلام."
slowed_title = "Slowed+Reverb"
slowed_body = "يبطئ المادة مع انخفاض طبقة الصوت ويضيف صدى بتأخير وتلاشٍ وتخميد ومستوى للصوت المعالج. على حدث فيديو يبطئ الصورة أيضًا."
note = "أي معامل لأي مؤثر أو انتقال أو عنوان يمكن أتمتته بالمنحنيات. مفاتيح الأتمتة مرتبطة بالمادة المصدر: تشذيب الحدث لا يحركها. ذيل الصدى يستمر بعد نهاية الحدث."
shot2_alt = "نافذة مؤثرات الصوت لمقطع واحد: معاملات Slowed+Reverb، وتحتها رسم الأتمتة بمنحنيات rate وmix على المفاتيح."
shot2_cap = "منحنيا rate وmix في Slowed+Reverb. تُسحب النقاط، ويمكن نسخ الغلاف إلى حدث آخر."

[more]
title = "الانتقالات والعناوين والمولّدات"
transitions_title = "33 انتقالًا"
transitions_body = "مسح وحدقة وساعة ودفع وانزلاق وتقريب ودوران ومرور سريع وستائر ومكعب وطي الصفحة وخلل واحتراق الفيلم وتسرب الضوء وغيرها. تُؤتمت معاملاتها كمعاملات المؤثرات."
titles_title = "العناوين"
titles_body = "إعدادات مسبقة لشريط الاسم والعنوان الرئيسي والآلة الكاتبة والنص المتحرك وشارة النهاية. الخط والمحاذاة والتعبئة والحد والظل والخلفية تُضبط لكل عنوان."
generators_title = "المولّدات"
generators_body = "ألوان مصمتة وتدرجات وأشكال وعد تنازلي وإشارات اختبار."

[morpher]
title = "المُحوّل"
standfirst = "يقع المُحوّل على مساره الخاص، وطوال مدته يغيّر الأحداث التي تحته: يطبّق دفعة مؤثرات أو يستبدل المصدر أو الاثنين معًا. له تلاشٍ وتحكم بالشدة، ويمكن دمجه في الأحداث."
shot_alt = "محرر دفعة المؤثرات في المُحوّل: يعمل على قائمة ثابتة من ستة مقاطع، ويسلسل استبدال المصدر مع VHS وGlow، ويضبط الشدة مع ظهور واختفاء تدريجيين، ويختار ملف المصدر الجديد، ويتيح الدمج والحذف."
shot_cap = "ستة أحداث مستهدفة: استبدال المصدر ثم VHS وGlow."
swap_title = "استبدال المصدر"
swap_body = "يستبدل مصدر الأحداث المستهدفة، مثل استبدال اللقطات الخام بالنسخة المصحّحة الألوان، أو يزيح كل نقاط الدخول بالمقدار نفسه. القطعات والمدد والمواضع لا تتغير."
batch_title = "دفعة المؤثرات"
batch_body = "تُضاف الدفعة إلى سلسلة مؤثرات كل حدث مستهدف وتعمل فورًا بلا تصيير."
delete_title = "الحذف"
delete_body = "المُحوّل لا يعدّل الأحداث المستهدفة، لذا يعود المونتاج إلى حالته السابقة بعد حذفه."
bake_title = "الدمج"
bake_body = "الدمج يكتب المُحوّل في الأحداث ويزيله، وتبقى الصورة والصوت كما هما. يمكن التراجع عن الدمج."

[bin]
title = "لوحة الوسائط"
standfirst = "تظهر الملفات المستوردة في اللوحة على شكل بطاقات. الملفات المفقودة تُفتح كعناصر نائبة وتعود للاتصال عند عودة الملفات."
shot_alt = "لوحة الوسائط بتخطيط حر: مجموعات مسماة للقطات والموسيقى والوسائط المولّدة، وبطاقات فيديو بإطار تمثيلي ومدة، وموسيقى مرسومة كشكل موجي، ومولّدات نص."
shot_cap = "اسم المجموعة مكتوب في فجوة إطارها.<br>تعرض البطاقات إطارًا تمثيليًا أو المدة أو شكلًا موجيًا."
poster_title = "المصغرات"
poster_body = "تعرض بطاقة الفيديو إطارًا ممثِّلًا للملف بدلًا من إطاره الأول."
scrub_title = "التصفح"
scrub_body = "تمرير الفأرة فوق البطاقة يشغّل الملف."
wave_title = "الأشكال الموجية"
wave_body = "تعرض بطاقات الصوت الشكل الموجي للملف."
groups_title = "المجموعات"
groups_body = "يمكن تجميع البطاقات وتسميتها وقفلها. تتحرك المجموعة ككتلة واحدة."
layout_title = "التخطيط"
layout_body = "تخطيط حر أو شبكة. يُحفظ الترتيب مع المشروع."
drag_title = "السحب إلى الخط الزمني"
drag_body = "أثناء سحب البطاقة يعرض الخط الزمني حدود الحدث والمسار الهدف وخط الالتقاط."

[export]
title = "التصدير"
standfirst = "MP4: فيديو H.264 وAAC بتردد 48 كيلوهرتز ستيريو وfaststart. إذا حُددت منطقة فلا تُصيَّر إلا هي."
shot_alt = "إعدادات التصيير: مرمّز الفيديو على الوضع التلقائي مع أولوية للعتاد، وجودة CRF، ومعدل بتات الصوت، ودقة المشروع، وAAC بتردد 48 كيلوهرتز ستيريو، وحاوية MP4 مع faststart."
shot_cap = "إعدادات التصيير: المرمّز والجودة والصوت والحاوية."
encoder_title = "اختيار المرمّز"
encoder_body = "في الوضع التلقائي تُجرَّب مرمّزات العتاد بالترتيب، ويُفتح كل منها قبل استخدامه، ويُتخطى ما لا يُفتح. ويمكن اختيار المرمّز يدويًا."
quality_title = "الجودة"
quality_body = "CRF أو معدل بتات مستهدف، وصوت من 128 إلى 320 كيلوبت/ث، ودقة المشروع أو أي حجم حتى 4K."
progress_title = "التقدم"
progress_body = "تعرض نافذة التصيير المرحلة والوقت المتبقي والسرعة نسبةً إلى الزمن الحقيقي. يمكن إيقاف التصيير مؤقتًا أو إلغاؤه."
inproc_title = "بلا ملفات وسيطة"
inproc_body = "يجري الترميز والتجميع داخل عملية المحرر من غير كتابة ملفات مؤقتة."
cli_title = "kt-cli"
cli_body = "أداة سطر الأوامر تصيّر ملف المشروع وتصدّره بلا نافذة."

[care]
title = "الحفظ والاستعادة"
autosave_title = "الحفظ التلقائي"
autosave_body = "كل 30 ثانية إذا تغيّر المشروع، لكن ليس أثناء السحب أو التشغيل. تُكتب الملفات ذريًا، فلا يترك الانهيار مشروعًا نصف مكتوب."
readable_title = "ملفات المشروع"
readable_body = "المشروع ملف JSON بمسارات نسبية إلى الوسائط، فيبقى المجلد صالحًا بعد نسخه أو نقله. يُحفظ فيه العرض وأسماء المسارات وتخطيط اللوحة."
cache_title = "الذاكرة المؤقتة"
cache_body = "تُخزَّن الأشكال الموجية والمصغرات في ملف بجانب المشروع. إذا حُذف أو تغيّر ملف مصدر فلا يُعاد بناء إلا ما تأثر."
warnings_title = "التشخيص"
warnings_body = "تعرض نافذة التشخيص امتلاء الذاكرة المؤقتة والإطارات المعروضة مقابل المُسقطة. عندما لا يلحق فك الترميز بالتشغيل يظهر إشعار بذلك."

