[hero]
eyebrow = "محرر فيديو · Linux · Windows"
h1 = "محرر فيديو مجاني <em>لنظامَي Linux وWindows</em>"
lede = "خط زمني متعدد المسارات مع معاينة فورية، وبكرات متداخلة، و33 انتقالًا، و26 مؤثرًا للفيديو و18 للصوت، وأتمتة بالمنحنيات لأي معامل، وعناوين ومولّدات. التصدير إلى MP4 يُخرج تمامًا ما تعرضه المعاينة."
cta_primary = "التنزيل"
cta_secondary = "الميزات"
cta_note = "Linux x86_64 · Windows 10/11"
shot_alt = "نافذة kinetren أثناء التشغيل: لوحة الوسائط على اليسار فيها اللقطات والموسيقى والعناوين المولّدة في مجموعات مسماة، ومعاينة الفيديو في الوسط وبجانبها مقاييس المستوى، وفي الأسفل خط زمني متعدد المسارات فيه علامات مسماة وعناوين وفيديو وموسيقى ومسار للمُحوّل."

