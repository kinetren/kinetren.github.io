[why]
title = "Рендер"
ship_title = "Один путь рендера"
ship_body = "Превью и экспорт в MP4 собирают кадр одним и тем же кодом. В файл попадает тот же кадр, что был в превью."
same_title = "Повторяемый результат"
same_body = "Один и тот же проект, отрендеренный дважды на одной машине, даёт одинаковые файлы, что бы ни проигрывалось и ни прокручивалось между рендерами."
stall_title = "Прокрутка не декодирует видео"
stall_body = "Волноформы, филмстрипы и миниатюры читаются из индекса, который строится один раз на файл. Прокрутка и зум таймлайна используют только его."
gpu_title = "Аппаратное кодирование"
gpu_body = "Кодеры NVIDIA, AMD и Intel находятся автоматически, запасной вариант — программный кодер. Экспорт не пишет временных файлов."

[edit]
title = "Таймлайн"
standfirst = "Видео-, аудио- и морф-дорожки. У каждой дорожки есть mute, solo, блокировка, свои эффекты, прозрачность и режим наложения. Дорожка перемещается за заголовок."
shot_alt = "Таймлайн крупно у метки DROP: вложенный ролик раскрыт на месте, его собственные дорожки с текстом, видео и звуком стоят между основными, а всё за пределами вхождения затенено с обеих сторон; филмстрипы вдоль видеоклипов, волноформы на аудиодорожках."
shot_cap = "Ролик STINGER раскрыт в середине монтажа. Части ролика за пределами этого вхождения затенены."
cut_title = "Разрез и подрезка"
cut_body = "<kbd>S</kbd> режет по курсору. Край события подрезается перетаскиванием."
region_title = "Регион"
region_body = "<kbd>I</kbd> и <kbd>O</kbd> задают регион. Его можно скопировать, удалить, вырезать из всех событий, которые он пересекает, зациклить и отрендерить."
snap_title = "Магнит"
snap_body = "События прилипают к краям других событий, меткам, границам региона, курсору и нулю. С зажатым <kbd>Ctrl</kbd> магнит при перетаскивании выключается."
marker_title = "Метки"
marker_body = "<kbd>M</kbd> ставит метку и открывает поле имени. Метки перетаскиваются по линейке и находятся поиском."
reels_title = "Ролики"
reels_body = "Выделение сворачивается в ролик, который можно использовать сколько угодно раз; изменения ролика применяются ко всем копиям. <kbd>Enter</kbd> раскрывает ролик на таймлайне. Опубликованные параметры дают каждой копии свои значения."
fades_title = "Фейды и кроссфейды"
fades_body = "Фейд задаётся перетаскиванием верхних углов события. Если надвинуть одно событие на другое, получится кроссфейд. Для прозрачности и громкости на событии есть линия уровня."
find_title = "Поиск"
find_body = "<kbd>Ctrl</kbd>+<kbd>F</kbd> ищет медиа, события, метки, дорожки и группы бина по имени. <kbd>Ctrl</kbd>+<kbd>L</kbd> переходит к набранному таймкоду."
undo_title = "Отмена"
undo_body = "Отменяется любое изменение, включая морферы и bake. Одно перетаскивание — один шаг отмены."

[playback]
title = "Воспроизведение"
standfirst = "Звук задаёт время, картинка следует за ним, поэтому на длинных таймлайнах изображение и звук не расходятся."
speed_title = "Полосы скорости"
speed_body = "Верхняя полоса задаёт постоянную скорость от −2× до +2×; правым кликом по ней вводится любая скорость до 8×. Нижняя — шаттл, который возвращается в ноль, когда его отпускают; если тянуть дальше его края, скорость доходит до ±8×. Двойной клик по любой полосе возвращает 1×."
space_title = "Удержание пробела"
space_body = "Пока <kbd>Space</kbd> зажат, воспроизведение за пять секунд разгоняется до 4×; если отпустить, замедляется. Короткое нажатие — играть или пауза, двойное — стоп в начале региона."
reverse_title = "Реверс"
reverse_body = "Отрицательная скорость проигрывает картинку и звук назад с точностью до кадра. Событие можно развернуть и в его свойствах."
loop_title = "Цикл"
loop_body = "Регион зацикливается без разрыва: его начало держится в кэше."
meters_title = "Метры уровня"
meters_body = "Сегментные метры по шкале в децибелах с удержанием пика и мастер-фейдер в dB. На паузе при скраббинге метр показывает уровень под курсором."
detach_title = "Второй монитор"
detach_body = "Двойной клик по превью открывает его в отдельном окне. Если окно закрыть, превью возвращается на место."

[effects]
title = "Эффекты"
standfirst = "Эффекты ставятся цепочкой на событие или на дорожку. Слоты переставляются и выключаются, превью обновляется сразу, а экспорт выполняет тот же код. Любую цепочку можно сохранить как пресет."
fx_cap = "26 видеоэффектов. Галерея показывает каждый на кадре выбранного события."
shot_alt = "Окно видео-эффектов с открытым пикером: поиск, пресеты с живыми миниатюрами клипа и эффекты по категориям, у каждого своя полоса миниатюр."
audio_title = "Звук"
list_title = "18 аудиоэффектов"
list_body = "Gain, Slowed+Reverb, Pitch Shift, Filter, EQ, Distortion, Bitcrusher, Tremolo, AutoPan, Vibrato, Chorus, Flanger, Phaser, Delay, Compressor, Gate, Limiter, Stereo Width. Компрессор на музыкальной дорожке умеет приглушать её под речь."
slowed_title = "Slowed+Reverb"
slowed_body = "Замедляет материал с понижением тона и добавляет реверберацию с задержкой, затуханием, демпфированием и уровнем wet. На видеособытии замедляет и картинку."
note = "Любой параметр любого эффекта, перехода и титра автоматизируется кривыми. Ключи автоматизации привязаны к исходному материалу: подрезка события их не сдвигает. Хвост реверберации звучит и после конца события."
shot2_alt = "Окно аудио-эффектов клипа: параметры Slowed+Reverb, под ними график автоматизации с кривыми rate и mix на кейфреймах."
shot2_cap = "Кривые rate и mix у Slowed+Reverb. Точки перетаскиваются, огибающую можно скопировать на другое событие."

[more]
title = "Переходы, титры, генераторы"
transitions_title = "33 перехода"
transitions_body = "Шторки, ирис, часы, сдвиг, наезд, зум, вращение, whip pan, жалюзи, куб, загиб страницы, глитч, прожог плёнки, засветки и другие. Их параметры автоматизируются так же, как параметры эффектов."
titles_title = "Титры"
titles_body = "Пресеты для плашки с именем, заголовка, печатной машинки, бегущей строки и финальных титров. Шрифт, выравнивание, заливка, обводка, тень и подложка настраиваются у каждого титра."
generators_title = "Генераторы"
generators_body = "Сплошные цвета, градиенты, фигуры, обратный отсчёт и тестовые сигналы."

[morpher]
title = "Морфер"
standfirst = "Морфер стоит на своей дорожке и, пока он длится, меняет события под ним: применяет батч эффектов, подменяет источник или делает и то и другое. У него есть фейды и сила, и его можно запечь в события."
shot_alt = "Редактор FX-батча морфера: действует на замороженный список из шести клипов, в цепочке замена источника, VHS и Glow, сила с нарастанием и спадом, выбор нового файла-источника, кнопки bake и удаления."
shot_cap = "Шесть целевых событий: замена источника, затем VHS и Glow."
swap_title = "Замена источника"
swap_body = "Подменяет источник целевых событий, например исходники на отгрейженный мастер, или сдвигает все точки входа на одну величину. Резы, длительности и позиции не меняются."
batch_title = "Батч эффектов"
batch_body = "Батч добавляется в цепочку эффектов каждого целевого события и действует сразу, без рендера."
delete_title = "Удаление"
delete_body = "Сами события морфер не изменяет, поэтому после его удаления монтаж возвращается в прежнее состояние."
bake_title = "Bake"
bake_body = "Bake записывает морфер в события и убирает его; картинка и звук остаются прежними. Bake отменяется."

[bin]
title = "Медиа-бин"
standfirst = "Импортированные файлы появляются в бине карточками. Отсутствующие файлы открываются заглушками и подключаются, когда файлы возвращаются."
shot_alt = "Медиа-бин в свободной раскладке: именованные группы футажа, музыки и сгенерированного, видеокарточки с постер-кадрами и длительностью, музыка волноформой, текстовые генераторы."
shot_cap = "Имя группы стоит в разрыве рамки.<br>На карточке — постер-кадр, длительность или волноформа."
poster_title = "Миниатюры"
poster_body = "Карточка видео показывает характерный кадр файла, а не первый."
scrub_title = "Скраббинг"
scrub_body = "Если провести мышью по карточке, файл проигрывается."
wave_title = "Волноформы"
wave_body = "Карточки аудио показывают волноформу файла."
groups_title = "Группы"
groups_body = "Карточки можно сгруппировать, назвать и заблокировать. Группа перемещается целиком."
layout_title = "Раскладка"
