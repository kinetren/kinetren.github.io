inproc_title = "Без промежуточных файлов"
inproc_body = "Кодирование и мультиплексирование идут внутри процесса редактора, без временных файлов."
cli_title = "kt-cli"
cli_body = "Консольная утилита рендерит и экспортирует файл проекта без окна."

[care]
title = "Сохранение и восстановление"
autosave_title = "Автосохранение"
autosave_body = "Каждые 30 секунд, если проект изменился, но не во время перетаскивания и воспроизведения. Файлы пишутся атомарно, поэтому падение не оставит недописанный проект."
readable_title = "Файлы проекта"
readable_body = "Проект — JSON-файл с относительными путями к медиа, поэтому скопированная или перенесённая папка продолжает работать, в том числе между Linux и Windows. Путь, абсолютный в другой системе, открывается заглушкой. В проекте сохраняются вид, имена дорожек и раскладка бина."
cache_title = "Кэш"
cache_body = "Волноформы и миниатюры хранятся в файле рядом с проектом. Если его удалить или исходный файл изменится, перестраивается только затронутое."
warnings_title = "Диагностика"
warnings_body = "Окно диагностики показывает заполнение кэша и число показанных и пропущенных кадров. Если декодирование не успевает за воспроизведением, появляется уведомление."

