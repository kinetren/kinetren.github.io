# Kinetren landing — Russian. The key set and order are defined by en.toml.
# Markup allowed in values: <em> <strong> <kbd> <code> <br>.
# Not translated: Kinetren, MP4, H.264, AAC, FFmpeg and effect names
# (Pan, Blur, VHS, Slowed+Reverb, Morpher) — rule 4 of i18n/README.md.

[site]
tagline = "Нелинейный видеоредактор для Linux, в котором превью и есть рендер: что слышно в монтаже, то и уходит в файл."
nav_edit = "Монтаж"
nav_effects = "Эффекты"
nav_morpher = "Морфер"
nav_export = "Экспорт"
nav_roadmap = "Планы"
nav_get = "Скачать"
lang_label = "Язык"
skip = "К содержимому"
footer_desc = "Нелинейный видеоредактор для Linux"
credits = "Авторы футажа"

[lang]
en = "English"
ru = "Русский"
es = "Español"
zh = "中文（简体）"
ar = "العربية"

[hero]
eyebrow = "Нелинейный видеоредактор · Linux"
h1 = "Что слышно в монтаже — <em>то и в файле</em>."
lede = "Kinetren держится на одном обещании: <strong>превью и есть рендер</strong>. Та же композиция, те же эффекты, тот же кадр — экспорт просто пишет это на диск. Один и тот же проект, отрендеренный дважды на одной машине, даёт побайтово одинаковые файлы."
cta_primary = "Скачать для Linux"
cta_secondary = "Что внутри"
cta_note = "x86_64 · тарбол · ставится без root"
shot_alt = "Окно Kinetren во время воспроизведения: слева медиа-бин с футажом, музыкой и сгенерированными титрами в именованных группах, в центре превью с живыми метрами уровня, внизу плотный многодорожечный таймлайн с именованными метками, титрами, видео, музыкой и дорожкой морфера."

[stats]
fx = "видео-эффектов"
tracks = "типа дорожек"
path = "путь рендера"
temp = "временных файлов"

[why]
title = "Чем он отличается"
ship_title = "Что видно — то и уходит"
ship_body = "Никакого прокси-пути и никакого сюрприза «в финальном качестве» в конце. Кадр в окне превью и кадр в MP4 выходят из одной и той же композиции."
same_title = "Каждый раз тот же файл"
same_body = "Отрендерьте проект сегодня и через месяц — файлы совпадут точно, сколько бы вы до этого ни скрабили, ни зацикливали и ни прыгали по таймлайну."
stall_title = "Таймлайн не подвисает"
stall_body = "Скролл и зум не трогают исходники. Волноформы, филмстрипы и постер-кадры читаются из индекса, построенного по файлу один раз, — поэтому вид остаётся мгновенным."
gpu_title = "Кодирует ваша видеокарта"
gpu_body = "Аппаратные энкодеры NVIDIA, AMD и Intel подбираются сами, с программным запасным вариантом, который действительно работает. Ни временных файлов, ни забитого scratch-диска."

[edit]
title = "Монтаж"
standfirst = "Видео-, аудио- и morph-дорожки, сколько угодно и в любом порядке — тянете заголовок дорожки, и строка едет целиком. Всё, что ниже, — это одна клавиша или одно перетаскивание."
shot_alt = "Таймлайн крупно у метки DROP: вложенный ролик раскрыт на месте, его собственные дорожки с текстом, видео и звуком стоят между основными, а всё за пределами вхождения затенено с обеих сторон; филмстрипы вдоль видеоклипов, волноформы на аудиодорожках."
shot_cap = "Ролик из середины монтажа раскрыт на месте: его дорожки прямо на таймлайне, всё за пределами вхождения затенено."
cut_title = "Разрез и трим"
cut_body = "Разрез по курсору — <kbd>S</kbd>. Трим — потянуть за край; у узких клипов середина остаётся перетаскиваемой, так что ручка не теряется в зонах трима."
region_title = "Всю работу делает регион"
region_body = "Отметьте вход и выход — <kbd>I</kbd> и <kbd>O</kbd> — и пользуйтесь регионом для всего: скопировать, удалить, вырезать его внутренность из всех пересекающих клипов, зациклить, отрендерить."
snap_title = "Магнит, который можно отпустить"
snap_body = "Включён по умолчанию, а <kbd>Ctrl</kbd> выключает его прямо посреди перетаскивания. Ловит края клипов, метки, границы региона, курсор и ноль."
marker_title = "Метки с именами"
marker_body = "<kbd>M</kbd> ставит метку и сразу открывает поле имени. Метки живут на линейке, тянутся мышью и находятся поиском."
paste_title = "Вставка строит цепочку"
paste_body = "<kbd>Ctrl</kbd>+<kbd>V</kbd> оставляет курсор в конце вставленного, поэтому следующее нажатие приставляет копию встык — без зазора, без шва, сэмпл в сэмпл."
link_title = "Картинка и звук держатся вместе"
link_body = "Клип и его звук двигаются и триммятся как одно целое, пока вы не разорвёте связку."
find_title = "Найти что угодно"
find_body = "<kbd>Ctrl</kbd>+<kbd>F</kbd> ищет сразу по меткам, медиа, дорожкам, клипам и группам бина. <kbd>Ctrl</kbd>+<kbd>L</kbd> переходит к набранному таймкоду."
undo_title = "Отмена значит отмена"
undo_body = "Отменяется всё, включая морферы и bake. Жест — это один шаг: перетаскивание клипа по таймлайну откатывается как одно движение, а не как сорок."

[playback]
title = "Воспроизведение"
standfirst = "Транспорт, на котором играют, а не которым управляют. <strong>Время держит звук</strong>, картинка идёт за ним — на длинном дубле ничего не расходится, а показываемая позиция сглаживается между обновлениями, поэтому движение не выглядит ступенчатым."
speed_title = "Две полосы скорости"
speed_body = "Верхняя держит постоянную скорость от −2× до +2×. Нижняя — подпружиненный шаттл, который возвращается, едва вы отпустили. Уведите курсор за виджет — откроется второе дыхание до ±8×. Двойной клик по любой — 1×."
space_title = "Зажать пробел и разогнаться"
space_body = "Держите <kbd>Space</kbd> — за пять секунд скорость разгоняется до 4×, а на отпускании плавно возвращается. Короткое нажатие — play/pause, двойное — стоп в начале региона."
reverse_title = "Реверс по-настоящему"
reverse_body = "Отрицательная скорость играет покадрово точно назад — вместе со звуком — и зацикливается назад через начало региона. Отдельный клип можно реверсировать как свойство клипа."
loop_title = "Петля без щелчка"
loop_body = "Луп региона непрерывен на стыке, это не пере-seek. Голова региона держится в кэше, поэтому заворот не спотыкается."
meters_title = "Метры, которые читаются как метры"
meters_body = "Дискретные LED-сегменты на настоящей децибельной сетке, спадающий пиковый кэп за ними и мастер-фейдер с показанием в dB. Скрабьте на паузе — метр покажет уровень под курсором."
detach_title = "Превью на второй экран"
detach_body = "Двойной клик по превью — и оно отделяется в собственное окно для второго монитора. Закрыли — вернулось в раскладку."

[effects]
title = "Эффекты"
standfirst = "Эффекты складываются в цепочку на клипе. Меняйте порядок слотов, глушите любой, не удаляя, и сразу видите результат в превью — <strong>экспорт исполняет ровно тот же код</strong>."
fx_cap = "Десять видео-эффектов. Пикер группирует их по назначению и фильтрует по мере набора."
shot_alt = "Окно видео-эффектов с открытым пикером: поиск, пресеты с живыми миниатюрами клипа и эффекты по категориям, у каждого своя полоса миниатюр."
audio_title = "Звук: два эффекта, один из них — ваш"
gain_title = "Gain"
gain_body = "Чистые ±24 dB на слот."
slowed_title = "Slowed + Reverb"
slowed_body = "Тот самый. Замедлите материал, дав питчу упасть вместе с ним, и промойте его ревербом, который вы лепите задержкой, затуханием, демпфированием и уровнем wet. Rate и mix кладутся на кейфреймы вдоль клипа."
note = "Две вещи, которые чувствуешь, а не вычитываешь: огибающая приколота к <em>материалу</em>, поэтому сдвиг раннего кейфрейма не утаскивает всё последующее — а хвост реверба дозванивает за концом клипа, а не обрубается. И правка соседнего клипа его тоже не укоротит."
shot2_alt = "Окно аудио-эффектов клипа: параметры Slowed+Reverb, под ними график автоматизации с кривыми rate и mix на кейфреймах."
shot2_cap = "Rate и mix на кейфреймах вдоль клипа. Тяните ромбы; огибающую можно скопировать на другой клип."

