[get]
title = "Скачать"
standfirst = "На Linux распакуйте архив и запустите установщик: он ставит всё в домашнюю папку без root, добавляет kinetren в меню приложений и регистрирует файлы проектов <code>.kt</code>. Раз в день программа спрашивает у GitHub, не вышла ли новая версия, и сообщает об этом в «Уведомлениях»; проверка выключается в окне «Настройки программы» (меню «Файл»)."
c_install = "Linux: распаковать и установить"
c_render = "или отрендерить из терминала"
system_label = "Linux"
system_value = "x86_64, glibc 2.35 или новее — Ubuntu 22.04+, Debian 12+, Fedora 36+"
windows_label = "Windows"
windows_value = "Windows 10 или 11, x86_64. Переносимый zip, ничего не устанавливается. При первом запуске kinetren находит shared-сборку FFmpeg 6, 7, 8 или 9 или предлагает её скачать."
gpu_label = "Графика"
gpu_value = "Драйвер с Vulkan, на Windows — также с DirectX 12. Без видеокарты программный драйвер Vulkan из Mesa (<code>mesa-vulkan-drivers</code>) выполняет всё на процессоре, медленнее. Без такого драйвера нет ни картинки, ни рендера."
video_label = "Видео"
video_value = "FFmpeg 6, 7, 8 или 9. На Linux используется системный, со всеми аппаратными ускорениями, с которыми он собран."
sound_label = "Звук"
sound_value = "ALSA или PipeWire на Linux, WASAPI на Windows. Устройства на 44,1 кГц и с 5.1 и 7.1 каналами получают звук через преобразование на выходе."
installs_label = "Ставится в"
