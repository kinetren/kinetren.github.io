[fxdesc]
pan = "Кроп, сдвиг и зум кадра в формат проекта. Fit, fill или stretch."
cammotion = "Движение камеры по кейфреймам вдоль клипа — наезд, отъезд, проезд, со сглаживанием."
mirror = "Отражение кадра по горизонтали, вертикали или обеим осям."
blur = "Смягчение картинки на заданный радиус."
green = "Выбивает цвет в прозрачность с допуском и мягкостью, и клип сверху ложится на тот, что снизу."
edges = "Контуры по Собелю — материал превращается в штриховку."
noise = "Плёночное зерно, одинаковое в превью и в экспорте."
vhs = "Сдвиг RGB-каналов и дрожащие скан-линии, под кассету."
glow = "Bloom на светлых участках кадра."
grid = "Раскладывает кадр плиткой по сетке ячеек."

[morpher]
title = "Морфер"
standfirst = "Морфер — это патч, который вы кладёте на собственную фиолетовую дорожку. В момент создания он замораживает выделенные клипы — и дальше меняет <strong>их все разом</strong>, не трогая ни один из них."
shot_alt = "Редактор FX-батча морфера: действует на замороженный список из шести клипов, в цепочке замена источника, VHS и Glow, сила с нарастанием и спадом, выбор нового файла-источника, кнопки bake и удаления."
shot_cap = "Шесть клипов заморожены: замена источника, поверх VHS и Glow. Bake записывает это в клипы."
swap_title = "Подменить источник под готовым монтажом"
swap_body = "Направьте сорок склеек на цветокорректированный мастер вместо чернового материала или сдвиньте все точки входа на одну величину. Монтаж — каждая склейка, каждая длительность, каждая позиция — остаётся ровно там, где вы его собрали."
batch_title = "Накинуть эффекты на всю группу"
batch_body = "Батч эффектов дописывается в цепочки всех целевых клипов и действует вживую. Нечего рендерить, нечего применять."
delete_title = "Удалили — как будто и не было"
delete_body = "Клипы никогда не менялись. Уберите патч, и монтаж вернётся туда, откуда начинал."
bake_title = "Bake, когда решили"
bake_body = "Bake вписывает патч в клипы, и блок исчезает — а картинка и звук не меняются ни на один сэмпл. Это организационное действие, а не рендер. И оно тоже отменяется."

[bin]
title = "Медиа-бин"
standfirst = "Бросьте файлы на окно — они лягут карточками. Бин — это место, которое вы раскладываете, а не список, который вы пролистываете."
shot_alt = "Медиа-бин в свободной раскладке: именованные группы футажа, музыки и сгенерированного, видеокарточки с постер-кадрами и длительностью, музыка волноформой, текстовые генераторы."
shot_cap = "Имя группы стоит в разрыве рамки.<br>На карточке — постер-кадр, длительность или волноформа."
poster_title = "Постер-кадры, на которые есть смысл смотреть"
poster_body = "Каждый файл получает самый информативный свой кадр — не нулевой, не чёрную ракорду и не затемнение."
scrub_title = "Отсмотреть, ничего не открывая"
scrub_body = "Проведите мышью по карточке — файл проигрывается прямо под курсором."
wave_title = "Звук выглядит как звук"
wave_body = "Аудиофайлы рисуют свою волноформу прямо на карточке."
groups_title = "Группы, именованные и запертые"
groups_body = "Выделите карточки, сгруппируйте, дайте группе имя, заприте, чтобы ничего не ездило. Тянете группу — она едет целиком."
layout_title = "Свободная раскладка или сетка"
layout_body = "На ваш выбор, сохраняется вместе с проектом — переключение между режимами никогда не перемешивает вашу раскладку."
drag_title = "Перетащить на таймлайн"
drag_body = "Ещё до того, как вы отпустите, видно призрак клипа, подсветку целевой дорожки и линию магнита."

[export]
title = "Экспорт"
standfirst = "MP4 — видео H.264, звук AAC 48 kHz стерео, faststart. Регион или весь проект — по тому, выделен ли регион."
shot_alt = "Настройки рендера: видео-кодек в режиме авто с приоритетом железа, качество CRF, аудио-битрейт, разрешение из проекта, AAC 48 кГц стерео, контейнер MP4 с faststart."
shot_cap = "Один диалог: кодек, качество, звук и контейнер — и Render."
encoder_title = "Энкодеры, которые действительно есть"
encoder_body = "Авторежим перебирает аппаратные энкодеры и по-настоящему открывает каждый, прежде чем на него положиться. Карта, заявившая энкодер, который не запускается, просто пропускается, а не роняет рендер. Хотите — выберите вручную."
quality_title = "Качество как вам нужно"
quality_body = "CRF или целевой битрейт, звук от 128 до 320 kbps, вывод в собственном разрешении проекта или в любом вплоть до 4K."
progress_title = "Прогресс, который что-то говорит"
progress_body = "В какой он фазе, сколько осталось и насколько быстро идёт относительно реального времени — минимум, среднее, текущая и пик. Можно поставить на паузу или отменить."
inproc_title = "Ничего не выходит за пределы программы"
inproc_body = "Кодирование и мукс идут внутри процесса. Ни промежуточных файлов, ни scratch-папки, ни гигабайтов сырья, записанных на диск и прочитанных обратно."
cli_title = "Рендер из терминала"
cli_body = "Консольная утилита без интерфейса рендерит тот же файл проекта — для ночных задач и скриптов."

[care]
title = "Он бережёт вашу работу"
autosave_title = "Автосейв, который не мешается"
autosave_body = "Каждые 30 секунд — но только если монтаж действительно менялся, и никогда посреди жеста мышью или во время воспроизведения. Пишется атомарно, поэтому сбой не оставит вас с половиной файла проекта."
readable_title = "Проекты, которые читаются"
readable_body = "Обычный JSON с относительными путями к вашим медиа. Перенесите папку, заархивируйте, отдайте другому — проект всё равно откроется. Вид, имена дорожек и раскладка бина вернутся вместе с ним."
cache_title = "Кэш — это просто кэш"
cache_body = "Волноформы и тумбнейлы лежат в файле рядом с проектом. Удалите его, побейте или замените исходник — пересоберётся только то, что изменилось."
warnings_title = "Предупреждения человеческим языком"
warnings_body = "Панель производительности с занятостью кэша, показанными кадрами против пропущенных и уведомлением, когда что-то действительно не так: «декод не успевает», а не счётчик, который надо истолковать."

