shot_alt = "Настройки рендера: видео-кодек в режиме авто с приоритетом железа, качество CRF, аудио-битрейт, разрешение из проекта, AAC 48 кГц стерео, контейнер MP4 с faststart."
shot_cap = "Настройки рендера: кодек, качество, звук и контейнер."
encoder_title = "Выбор кодера"
encoder_body = "В автоматическом режиме аппаратные кодеры перебираются по очереди, и каждый перед использованием открывается; тот, что не открылся, пропускается. Кодер можно выбрать и вручную."
