[why]
title = "Рендер"
ship_title = "Один путь рендера"
ship_body = "Превью и экспорт собирают кадр одним движком на видеокарте; без видеокарты он работает на процессоре через Vulkan. В файл попадает тот же кадр, что был в превью."
same_title = "Повторяемый результат"
same_body = "Один и тот же проект, отрендеренный дважды на одной машине, даёт одинаковые файлы, что бы ни проигрывалось и ни прокручивалось между рендерами. Звук одинаков на Linux и Windows и на любом процессоре, картинка — на одной и той же видеокарте."
stall_title = "Прокрутка не декодирует видео"
stall_body = "Волноформы, филмстрипы и миниатюры читаются из индекса, который строится один раз на файл. Прокрутка и зум таймлайна используют только его."
gpu_title = "Аппаратное кодирование"
gpu_body = "Кодеры NVIDIA, AMD и Intel находятся автоматически, запасной вариант — программный кодер. Если при пробе аппаратного кодера падает драйвер видеокарты, рендер в автоматическом режиме переходит к следующему кодеру, а программа остаётся открытой. Экспорт не пишет временных файлов."

[edit]
title = "Таймлайн"
standfirst = "Видео-, аудио-, морф-дорожки и дорожки камеры. У каждой дорожки есть mute, solo, блокировка, свои эффекты, прозрачность и режим наложения. Дорожка перемещается за заголовок."
shot_alt = "Таймлайн крупно у метки DROP: вложенный ролик раскрыт на месте, его собственные дорожки с текстом, видео и звуком стоят между основными, а всё за пределами вхождения затенено с обеих сторон; филмстрипы вдоль видеоклипов, волноформы на аудиодорожках."
shot_cap = "Ролик STINGER раскрыт в середине монтажа. Части ролика за пределами этого вхождения затенены."
cut_title = "Разрез и подрезка"
cut_body = "<kbd>S</kbd> режет по курсору. Край события подрезается перетаскиванием."
freeze_title = "Стоп-кадр"
freeze_body = "«Вставить стоп-кадр (freeze frame)» в контекстном меню события держит картинку на месте курсора 2 секунды, затем она идёт дальше с того же кадра. Длина события не меняется."
region_title = "Регион"
region_body = "<kbd>I</kbd> и <kbd>O</kbd> задают регион; тройной клик по событию ставит регион по нему. Регион можно скопировать, удалить, зациклить и отрендерить. <kbd>C</kbd> вырезает регион из всех событий, которые он пересекает, остальное остаётся на месте."
snap_title = "Магнит"
snap_body = "События прилипают к краям других событий, меткам, границам региона, курсору и нулю. С зажатым <kbd>Ctrl</kbd> магнит при перетаскивании выключается."
marker_title = "Метки"
marker_body = "<kbd>M</kbd> ставит метку и открывает поле имени. Щелчок по метке ставит на неё курсор воспроизведения. Метки перетаскиваются по линейке и находятся поиском. «Заметка…» в контекстном меню метки добавляет многострочную заметку; она показывается в строке состояния и уходит в OpenTimelineIO как комментарий метки."
reels_title = "Ролики"
reels_body = "Выделение сворачивается в ролик, который можно использовать сколько угодно раз; изменения ролика применяются ко всем копиям. <kbd>Enter</kbd> раскрывает ролик на таймлайне. Опубликованные параметры дают каждой копии свои значения."
fades_title = "Фейды и кроссфейды"
fades_body = "Фейд задаётся перетаскиванием верхних углов события. Если надвинуть одно событие на другое, получится кроссфейд. Для прозрачности и громкости на событии есть линия уровня; громкость опускается до тишины, а изменённый уровень пишется после имени события."
find_title = "Поиск"
find_body = "<kbd>Ctrl</kbd>+<kbd>F</kbd> ищет медиа, события, метки, дорожки и группы бина по имени. <kbd>Ctrl</kbd>+<kbd>L</kbd> переходит к набранному таймкоду."
styles_title = "Раскладка и управление"
styles_body = "При первом запуске или в «Файл → Настройки программы…» клавиши, колесо мыши и панели можно сделать как в VEGAS, Premiere Pro, DaVinci Resolve, Final Cut Pro или After Effects. «Настроить» меняет любую клавишу, а код настроек возвращает всё после переустановки."
undo_title = "Отмена"
undo_body = "Отменяется любое изменение, включая морферы и bake. Одно перетаскивание — один шаг отмены."

[playback]
title = "Воспроизведение"
standfirst = "Звук задаёт время, картинка следует за ним, поэтому на длинных таймлайнах изображение и звук не расходятся."
speed_title = "Полосы скорости"
speed_body = "Верхняя полоса задаёт постоянную скорость от −2× до +2×; правым кликом по ней вводится любая скорость до 8×. Нижняя — шаттл, который возвращается в ноль, когда его отпускают; если тянуть дальше его края, скорость доходит до ±8×. Двойной клик по любой полосе возвращает 1×."
space_title = "Пробел и стрелки"
space_body = "Короткое нажатие — играть или пауза, двойное — стоп в начале региона. Если держать <kbd>Space</kbd> во время воспроизведения, оно за пять секунд разгоняется до 4×; если держать на паузе, играет, только пока клавиша зажата. <kbd>Ctrl</kbd>+<kbd>Space</kbd> играет назад, пока зажаты. <kbd>←</kbd> и <kbd>→</kbd> сдвигают на один кадр."
reverse_title = "Реверс"
reverse_body = "Отрицательная скорость проигрывает картинку и звук назад с точностью до кадра. Событие можно развернуть и в его свойствах."
loop_title = "Цикл"
loop_body = "Регион зацикливается без разрыва. Картинка и звук после эффектов сохраняются такими, какими проигрались впервые, поэтому цикл с тяжёлыми эффектами с третьего круга идёт с частотой кадров проекта. Куски, слишком медленные для реального времени, программа досчитывает в фоне, пока простаивает, и хранит на диске (до 2 ГБ), если у видеокарты есть видеокодер."
meters_title = "Метры уровня"
meters_body = "Сегментные метры по шкале в децибелах с удержанием пика и мастер-фейдер в dB. На паузе при скраббинге метр показывает уровень под курсором."
detach_title = "Второй монитор"
detach_body = "Двойной клик по превью открывает его в отдельном окне. Если окно закрыть, превью возвращается на место."

[effects]
title = "Эффекты"
standfirst = "Эффекты ставятся цепочкой на событие или на дорожку и показываются графом узлов в порядке их работы; у видеособытия и его связанного звука один граф. Узлы перетаскиваются, чтобы поменять порядок, и выключаются, превью обновляется сразу, а экспорт выполняет тот же код. <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+клик по узлу показывает картинку после этого эффекта. У каждого цвета есть пипетка, которая берёт цвет из любого места программы. Любую цепочку можно сохранить как пресет."
fx_cap = "29 видеоэффектов. Галерея показывает каждый на кадре выбранного события."
shot_alt = "Пикер эффектов, прокрученный до конца галереи: 3D-эффекты, цвет и искажения, затем Camera ISP и VHS Tape, у каждого миниатюры пресетов на кадре самого события."
audio_title = "Звук"
list_title = "18 аудиоэффектов"
list_body = "Gain, Slowed+Reverb, Pitch Shift, Filter, EQ, Distortion, Bitcrusher, Tremolo, AutoPan, Vibrato, Chorus, Flanger, Phaser, Delay, Compressor, Gate, Limiter, Stereo Width. Компрессор на музыкальной дорожке умеет приглушать её под речь."
slowed_title = "Slowed+Reverb"
slowed_body = "Замедляет материал с понижением тона и добавляет реверберацию с задержкой, затуханием, демпфированием и уровнем wet. На видеособытии замедляет и картинку."
note = "Любой параметр любого эффекта, перехода и титра автоматизируется кривыми; несколько ключей можно выделить и двигать вместе. Ключи автоматизации привязаны к исходному материалу: подрезка события их не сдвигает. Хвост реверберации звучит и после конца события."
shot2_alt = "Окно аудио-эффектов клипа: параметры Slowed+Reverb, под ними график автоматизации с кривыми rate и mix на кейфреймах."
shot2_cap = "Кривые rate и mix у Slowed+Reverb. Точки перетаскиваются, огибающую можно скопировать на другое событие."
sim_title = "Симуляции"
sim_body = "Три эффекта категории «Симуляция» моделируют само устройство и его процесс, а картинка следует из причин. Их шум и дефекты одинаковы при каждом проигрывании, переходе и рендере. На событии со связанным звуком каждый из них обрабатывает и звук; его выключатель стоит в цепочке звука."
g_fx_datamosh_alt = "Два варианта одного ночного кадра города рядом: слева как снято, справа с Datamosh — движение города тащит по кадру склон холма из предыдущего плана."
g_fx_datamosh_cap = "Datamosh, пресет «Склейка», сразу после склейки. Слева — кадр как снят. Справа — без ключевого кадра движение нового плана тащит предыдущий."
g_fx_datamosh_body = "Datamosh прогоняет клип через собственный видеокодек и ломает его: выброшенные ключевые кадры, повтор движения, чужие векторы движения, с кривыми и ключами Reset. Звук идёт через аудиокодек в том же потоке: выброшенный ключевой кадр уносит с собой аудиопакет, а ключ Reset лечит и то и другое."
g_fx_camera_isp_alt = "Два варианта одного ночного кадра с дрона, подсвеченная башня, рядом: слева как снято, справа через Camera ISP с образом «Телефон ночью» — цветной шум сенсора и мазня шумодава."
g_fx_camera_isp_cap = "Camera ISP, образ «Телефон ночью». Слева — исходный кадр. Справа — шум сенсора, мазня шумодава и тональная кривая телефона."
g_fx_camera_isp_body = "Эффект превращает кадр обратно в сцену и снимает её заново через объектив, цветную мозаику, сенсор и процессор камеры; любой блок можно выключить или настроить неверно, а «Вид» показывает любую стадию. Его образы задают и микрофон устройства: акустический порт, ветер, автоматическую регулировку усиления, шумоподавление и кодек."
g_fx_vhs_tape_alt = "Окно эффекта VHS Tape: нарисованный барабан с двумя головками, головка A в состоянии «Сколотая», переключатели PAL, SP, один магнитофон и две головки, рядом кадр, воспроизведённый с ленты, с полосой выпадений."
g_fx_vhs_tape_cap = "VHS Tape: панель магнитофона с головкой A в состоянии «Сколотая» и кадр, который воспроизводит лента."
g_fx_vhs_tape_body = "Картинка записывается на смоделированную ленту и читается обратно; щелчок по головке на барабане делает её грязной, забитой или сколотой, переключаются SP/LP/EP, 2 или 4 головки, TBC и два магнитофона. Звук играет с того же магнитофона: дорожки Hi-Fi трещат там, где головка ломает картинку, а линейная дорожка шипит и плывёт по высоте."
g_masks_alt = "Ночной город на превью с маской-пером вокруг силуэта небоскрёбов: сплошной контур с точками, пунктир растушёвки снаружи и синий тон Duotone только внутри маски."
g_masks_cap = "Маска-перо с точками и растушёвкой; Duotone тонирует только силуэт города внутри неё."
masks_title = "Маски"
masks_body = "Прямоугольник, эллипс и перо Безье рисуются прямо на превью. Маска вырезает картинку события, ограничивает один эффект или вырезает целую дорожку. У каждой есть растушёвка, расширение, непрозрачность, инверсия и режим (Добавить, Вычесть, Пересечь, Разность); маски складываются сверху вниз, а форму можно анимировать ключами."

[more]
title = "Переходы, титры, генераторы"
transitions_title = "33 перехода"
transitions_body = "Шторки, ирис, часы, сдвиг, наезд, зум, вращение, whip pan, жалюзи, куб, загиб страницы, глитч, прожог плёнки, засветки и другие. Их параметры автоматизируются так же, как параметры эффектов. Поле «Вид» показывает каждый вид картинкой разреза на середине перехода."
titles_title = "Титры"
titles_body = "Пресеты для плашки с именем, заголовка, печатной машинки, бегущей строки и финальных титров. Шрифт, выравнивание, заливка, обводка, тень и подложка настраиваются у каждого титра. Текст может быть набранным или идущим таймкодом, секундомером или обратным отсчётом."
generators_title = "Генераторы"
generators_body = "Сплошные цвета, градиенты, фигуры, движущиеся фоны, обратный отсчёт и тестовые сигналы. Среди фигур — многоугольник, звезда, стрелка, рамка, плашка нижней трети и полоса прогресса; движущиеся фоны — движущийся градиент, плазма, частицы и узор. Синхровспышка ставит вспышку и бип на один кадр, а «Безопасные зоны» рисуют рамки безопасных зон действия и титров. Звуковые генераторы на аудиодорожке: тон, звуковой шум, свип-тон, серия бипов и тишина."

[morpher]
title = "Морфер"
standfirst = "Морфер стоит на своей дорожке и, пока он длится, меняет события под ним: применяет батч эффектов, подменяет источник или делает и то и другое. У него есть фейды и сила, и его можно запечь в события."
shot_alt = "Редактор FX-батча морфера: действует на замороженный список из шести клипов, в цепочке замена источника и VHS Tape, сила с нарастанием и спадом, выбор нового файла-источника, кнопки bake и удаления."
shot_cap = "Шесть целевых событий: замена источника, затем VHS Tape."
swap_title = "Замена источника"
swap_body = "Подменяет источник целевых событий, например исходники на отгрейженный мастер, или сдвигает все точки входа на одну величину. Резы, длительности и позиции не меняются."
batch_title = "Батч эффектов"
batch_body = "В батче могут быть видео- и аудиоэффекты. Он добавляется в цепочку эффектов каждого целевого события и действует сразу, без рендера. У VHS Tape, Datamosh и Camera ISP звуковая половина стоит рядом с картиночной, и любую из них можно выключить для слоя."
delete_title = "Удаление"
delete_body = "Сами события морфер не изменяет, поэтому после его удаления монтаж возвращается в прежнее состояние."
bake_title = "Bake"
bake_body = "Bake записывает морфер в события и убирает его; картинка и звук остаются прежними. Bake отменяется."

[bin]
title = "Медиа-бин"
standfirst = "Импортированные файлы появляются в бине карточками. Отсутствующие файлы открываются заглушками и подключаются, когда файлы возвращаются."
shot_alt = "Медиа-бин в свободной раскладке: именованные группы футажа, музыки и сгенерированного, видеокарточки с постер-кадрами и длительностью, музыка волноформой, текстовые генераторы."
shot_cap = "Имя группы стоит в разрыве рамки.<br>На карточке — постер-кадр, длительность или волноформа."
poster_title = "Миниатюры"
poster_body = "Карточка видео показывает характерный кадр файла, а не первый."
scrub_title = "Скраббинг"
scrub_body = "Если провести мышью по карточке, файл проигрывается, а под курсором пишется время файла."
wave_title = "Волноформы"
wave_body = "Карточки аудио показывают волноформу файла."
groups_title = "Группы"
groups_body = "Карточки можно сгруппировать, назвать и заблокировать. Группа перемещается целиком."
layout_title = "Раскладка"
layout_body = "Свободная раскладка или сетка. Расположение сохраняется в проекте."
drag_title = "Перетаскивание на таймлайн"
drag_body = "Карточка, перетащенная на дорожку, ложится так, что под мышью оказывается выбранный прокруткой момент; с <kbd>Alt</kbd> — начало файла, с <kbd>Alt</kbd>+<kbd>Shift</kbd> — его конец. До отпускания контур на дорожке показывает длину и положение файла."

[export]
title = "Экспорт"
standfirst = "MP4, MOV, MKV или WebM; видео H.264, H.265, AV1, VP9 или ProRes 422 HQ; звук AAC, Opus, PCM или FLAC, 48 кГц стерео. Если задан регион, рендерится он или, по выбору, весь проект."
shot_alt = "Настройки рендера: видео-кодек в режиме авто с приоритетом железа, качество CRF, аудио-битрейт, разрешение из проекта, AAC 48 кГц стерео, контейнер MP4 с faststart."
shot_cap = "Настройки рендера: кодек, качество, звук и контейнер."
encoder_title = "Выбор кодера"
encoder_body = "В автоматическом режиме аппаратные кодеры выбранного кодека перебираются по очереди, и каждый перед использованием открывается; тот, что не открылся, пропускается. Кодер можно выбрать и вручную. То, чего не умеет установленный FFmpeg или контейнер, показано серым с причиной."
quality_title = "Качество"
quality_body = "Постоянное качество, средний битрейт с максимумом или постоянный битрейт; скорость кодера, интервал ключевых кадров, B-кадры, 8 или 10 бит, BT.601 или BT.709 с ограниченным или полным диапазоном; размер проекта, готовый размер до 2160p или свой; частота кадров. Настройки сохраняются как пресеты, общие для всех проектов."
progress_title = "Прогресс"
progress_body = "Окно рендера называет кодировщик до первого кадра и показывает фазу, оставшееся время, скорость с графиком, размер файла и битрейт; его журнал пишется в журнал телеметрии. Если диапазон уже проигрывался, окно предсказывает время рендера и сравнивает размер превью с размером файла. В конце оно даёт громкость результата (LUFS, true peak) и открывает файл или его папку. Рендер можно поставить на паузу или отменить. Существующий файл заменяется только после вопроса."
inproc_title = "Без промежуточных файлов"
inproc_body = "Кодирование и мультиплексирование идут внутри процесса редактора, без временных файлов."
cli_title = "kt-cli"
cli_body = "Консольная утилита рендерит и экспортирует файл проекта с настройками окна рендера, без окна и без дисплея."

[care]
title = "Сохранение и восстановление"
autosave_title = "Автосохранение"
autosave_body = "Каждые 30 секунд, если проект изменился, правка пишется в файл восстановления рядом с проектом; сам проект пишет только <kbd>Ctrl</kbd>+<kbd>S</kbd>. Во время долгого воспроизведения файл восстановления тоже пишется. Файлы пишутся атомарно, поэтому падение не оставит недописанный проект."
readable_title = "Файлы проекта"
readable_body = "Проект — JSON-файл с относительными путями к медиа, поэтому скопированная или перенесённая папка продолжает работать, в том числе между Linux и Windows. Путь, абсолютный в другой системе, открывается заглушкой. В проекте сохраняются вид, имена дорожек и раскладка бина."
cache_title = "Кэш"
cache_body = "Волноформы и миниатюры хранятся в файле рядом с проектом. Если его удалить или исходный файл изменится, перестраивается только затронутое."
warnings_title = "Диагностика"
warnings_body = "Окно диагностики показывает, сколько памяти держит программа и из чего она складывается, число показанных и пропущенных кадров и три графика во времени: воспроизведение, работу FFmpeg и кэш. Журнал телеметрии записывает воспроизведение, предупреждения и действия пользователя с часовым временем; <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>M</kbd> отмечает в нём момент. Журнал остаётся на компьютере. Если программа падает, окно называет часть, где произошёл сбой, и предлагает «Восстановить проект»."

