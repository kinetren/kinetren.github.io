region_pull_l = "Saltar atrás arrastrando el borde de la región"
region_pull_r = "Saltar adelante arrastrando el borde de la región"
region_loop = "Bucle de la región"
region_marker = "Poner un marcador en el cursor o quitar el que hay"
region_clear = "Paso atrás: cerrar la ventana superior, quitar la región y la selección, salir de la bobina"
