[roadmap]
title = "Planes"
shipped_title = "Versiones"
next_title = "Previsto"
v261025 = "Windows: cuando la tarjeta gráfica no puede ejecutar los efectos, también en una máquina virtual sin controlador gráfico, el render pasa a la CPU y lo avisa. Windows y Linux exportan la misma imagen."
v261024 = "Versión para Windows: un zip portátil. FFmpeg 6, 7 u 8 se busca en el sistema o se descarga en el primer arranque."
