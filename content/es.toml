[why]
title = "Render"
ship_title = "Un solo camino de render"
ship_body = "La previsualización y la exportación componen el fotograma con el mismo motor en el dispositivo gráfico; sin tarjeta gráfica funciona en el procesador mediante Vulkan. El fotograma exportado es el que se vio en la previsualización."
same_title = "Resultado repetible"
same_body = "El mismo proyecto renderizado dos veces en la misma máquina da archivos idénticos, se haya reproducido o recorrido lo que sea entre ambos renders. El sonido es idéntico en Linux y Windows y en cualquier procesador; la imagen, en el mismo dispositivo gráfico."
stall_title = "El desplazamiento no decodifica vídeo"
stall_body = "Las formas de onda, las tiras de fotogramas y las miniaturas se leen de un índice que se crea una vez por archivo. El desplazamiento y el zoom de la línea de tiempo solo usan ese índice."
gpu_title = "Codificación por hardware"
gpu_body = "Los codificadores de NVIDIA, AMD e Intel se detectan automáticamente, con un codificador por software como alternativa. Si el controlador gráfico falla mientras se prueba un codificador por hardware, un render en modo automático pasa al siguiente codificador y el programa sigue abierto. La exportación no escribe archivos temporales."

[edit]
title = "Línea de tiempo"
standfirst = "Pistas de vídeo, audio, morph y cámara. Cada pista tiene silencio, solo, bloqueo, sus propios efectos, opacidad y modo de fusión. Una pista se mueve arrastrando su cabecera."
shot_alt = "Línea de tiempo de cerca en el marcador DROP: una bobina anidada abierta en su sitio, con sus propias pistas de texto, vídeo y audio entre las pistas principales y las partes fuera de la instancia veladas a ambos lados; tiras de fotogramas en los clips de vídeo y formas de onda en las pistas de audio."
shot_cap = "La bobina STINGER desplegada en mitad del montaje. Las partes de la bobina fuera de esta instancia aparecen veladas."
cut_title = "Cortar y recortar"
cut_body = "<kbd>S</kbd> corta en el cursor. El borde de un evento se recorta arrastrándolo."
freeze_title = "Congelar imagen"
freeze_body = "Insertar congelación de imagen (freeze frame), en el menú contextual de un evento, detiene la imagen en el cabezal durante 2 segundos y luego sigue desde el mismo fotograma. El evento conserva su duración."
region_title = "Región"
region_body = "<kbd>I</kbd> y <kbd>O</kbd> fijan la región; un triple clic en un evento la fija sobre el evento. Se puede copiar, borrar, reproducir en bucle y renderizar. <kbd>C</kbd> recorta la región de todos los eventos que cruza y deja el resto en su sitio."
snap_title = "Ajuste"
snap_body = "Los eventos se ajustan a los bordes de otros eventos, a los marcadores, a los límites de la región, al cursor y al cero. Con <kbd>Ctrl</kbd> pulsado el ajuste se desactiva al arrastrar."
marker_title = "Marcadores"
marker_body = "<kbd>M</kbd> añade un marcador y abre el campo de su nombre. Un clic en un marcador lleva el cabezal a él. Los marcadores se arrastran por la regla y aparecen en la búsqueda. Nota…, en el menú contextual del marcador, añade una nota de varias líneas; se muestra en la línea de estado y se exporta a OpenTimelineIO como comentario del marcador."
reels_title = "Bobinas"
reels_body = "Una selección se agrupa en una bobina que se puede usar cuantas veces se quiera; los cambios en la bobina se aplican a todas las copias. <kbd>Enter</kbd> despliega la bobina en la línea de tiempo. Los parámetros publicados dan a cada copia sus propios valores."
fades_title = "Fundidos y fundidos cruzados"
fades_body = "Un fundido se ajusta arrastrando las esquinas superiores del evento. Si se arrastra un evento sobre otro, se obtiene un fundido cruzado. La opacidad y el volumen tienen una línea de nivel sobre el evento; el volumen baja hasta el silencio, y un nivel cambiado se escribe tras el nombre del evento."
find_title = "Búsqueda"
find_body = "<kbd>Ctrl</kbd>+<kbd>F</kbd> busca medios, eventos, marcadores, pistas y grupos del panel por nombre. <kbd>Ctrl</kbd>+<kbd>L</kbd> salta al código de tiempo escrito."
styles_title = "Disposición y controles"
styles_body = "En el primer inicio, o en Archivo → Preferencias…, las teclas, la rueda del ratón y los paneles pueden seguir a VEGAS, Premiere Pro, DaVinci Resolve, Final Cut Pro o After Effects. Personalizar cambia cualquier tecla, y un código de ajustes lo restaura todo tras reinstalar."
undo_title = "Deshacer"
undo_body = "Se puede deshacer cualquier cambio, incluidos los mórferes y su aplicación. Un arrastre es un paso de deshacer."

[playback]
title = "Reproducción"
standfirst = "El audio marca el tiempo y la imagen lo sigue, así que imagen y sonido no se desfasan en líneas de tiempo largas."
speed_title = "Barras de velocidad"
speed_body = "La barra superior fija una velocidad constante de −2× a +2×; con clic derecho se escribe cualquier velocidad hasta 8×. La inferior es un shuttle que vuelve a cero al soltarlo; si se arrastra más allá de su extremo, llega a ±8×. Un doble clic en cualquiera de las dos vuelve a 1×."
space_title = "Espacio y flechas"
space_body = "Una pulsación corta reproduce o pausa; dos seguidas paran al inicio de la región. Mantenido durante la reproducción, <kbd>Space</kbd> acelera hasta 4× en cinco segundos; mantenido desde una pausa, reproduce solo mientras se mantiene. <kbd>Ctrl</kbd>+<kbd>Space</kbd> reproduce hacia atrás mientras se mantiene. <kbd>←</kbd> y <kbd>→</kbd> avanzan o retroceden un fotograma."
reverse_title = "Reproducción inversa"
reverse_body = "La velocidad negativa reproduce imagen y sonido hacia atrás con precisión de fotograma. Un evento también se puede invertir en sus propiedades."
loop_title = "Bucle"
loop_body = "La región se repite sin hueco. La imagen y el sonido se guardan tras los efectos tal como se reprodujeron la primera vez, así que un bucle con efectos pesados va a la frecuencia del proyecto desde la tercera vuelta. Las partes demasiado lentas para el tiempo real se terminan en segundo plano mientras el programa está inactivo y se guardan en disco, hasta 2 GB, si la tarjeta gráfica tiene codificador de vídeo."
meters_title = "Vúmetros"
meters_body = "Medidores por segmentos en escala de decibelios con retención de pico y un fader maestro en dB. En pausa, al recorrer el material, el medidor muestra el nivel bajo el cursor."
detach_title = "Segundo monitor"
detach_body = "Un doble clic en la previsualización la abre en una ventana aparte. Al cerrar la ventana, la previsualización vuelve a su sitio."

[effects]
title = "Efectos"
standfirst = "Los efectos se encadenan en un evento o en una pista y se muestran como un grafo de nodos en el orden en que actúan; un evento de vídeo y su sonido vinculado comparten un grafo. Los nodos se arrastran para reordenarlos y se desactivan, la previsualización se actualiza al momento y la exportación ejecuta el mismo código. <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+clic en un nodo muestra la imagen tras ese efecto. Cada color tiene un cuentagotas que toma un color de cualquier parte del programa. Cualquier cadena se puede guardar como preajuste."
fx_cap = "29 efectos de vídeo. La galería muestra cada uno sobre un fotograma del evento seleccionado."
shot_alt = "El selector de efectos desplazado al final de su galería: efectos 3D, de color y de distorsión, luego Camera ISP y VHS Tape, cada uno con miniaturas de sus preajustes sobre un fotograma del propio evento."
audio_title = "Audio"
list_title = "18 efectos de audio"
list_body = "Gain, Slowed+Reverb, Pitch Shift, Filter, EQ, Distortion, Bitcrusher, Tremolo, AutoPan, Vibrato, Chorus, Flanger, Phaser, Delay, Compressor, Gate, Limiter, Stereo Width. Un compresor en una pista de música puede bajarla bajo la voz."
slowed_title = "Slowed+Reverb"
slowed_body = "Ralentiza el material bajando el tono y añade reverberación con retardo, caída, amortiguación y nivel de efecto. En un evento de vídeo ralentiza también la imagen."
note = "Cualquier parámetro de cualquier efecto, transición o rótulo se automatiza con curvas; varias claves se pueden seleccionar y mover juntas. Las claves de automatización están ligadas al material de origen: recortar un evento no las mueve. La cola de la reverberación sigue sonando después del final del evento."
shot2_alt = "La ventana de efectos de audio de un clip: parámetros de Slowed+Reverb y, debajo, el gráfico de automatización con curvas de rate y mix por claves."
shot2_cap = "Curvas de rate y mix de Slowed+Reverb. Los puntos se arrastran y una envolvente se puede copiar a otro evento."
sim_title = "Simulaciones"
sim_body = "Tres efectos de la categoría Simulación modelan el aparato y su proceso, y el aspecto resulta de las causas. Su ruido y sus defectos son los mismos en cada reproducción, salto y render. En un evento con audio vinculado, cada uno procesa también el sonido; su interruptor está en la cadena del audio."
g_fx_datamosh_alt = "Dos versiones de un mismo fotograma nocturno de una ciudad, una junto a otra: a la izquierda tal como se filmó, a la derecha con Datamosh, donde el movimiento de la ciudad arrastra la ladera del plano anterior por la imagen."
g_fx_datamosh_cap = "Datamosh, preajuste Corte, justo después de un corte. Izquierda: el fotograma tal como se filmó. Derecha: sin el fotograma clave, el movimiento del plano nuevo arrastra el anterior."
g_fx_datamosh_body = "Datamosh pasa su propio códec de vídeo por el clip y lo rompe: fotogramas clave eliminados, movimiento repetido, vectores de movimiento prestados, con curvas y claves Reset. El sonido pasa por un códec de audio en el mismo flujo: un fotograma clave eliminado se lleva su paquete de audio, y una clave Reset cura ambos."
g_fx_camera_isp_alt = "Dos versiones de un mismo fotograma aéreo nocturno de una torre iluminada, una junto a otra: a la izquierda tal como se filmó, a la derecha con Camera ISP y el aspecto Móvil de noche, cubierto de ruido de color del sensor y del borrón del reductor de ruido."
g_fx_camera_isp_cap = "Camera ISP, aspecto Móvil de noche. Izquierda: el fotograma original. Derecha: ruido del sensor, el borrón del reductor de ruido y la curva tonal del móvil."
g_fx_camera_isp_body = "El efecto devuelve el fotograma a una escena y la filma de nuevo con una lente, un mosaico de color, un sensor y el procesador de la cámara; cada bloque se puede desactivar o ajustar mal, y Vista muestra cualquier etapa. Sus aspectos fijan también el micrófono del aparato: el puerto acústico, el viento, el control automático de ganancia, la supresión de ruido y el códec."
g_fx_vhs_tape_alt = "La ventana de efectos de VHS Tape con el tambor dibujado y sus dos cabezales, el cabezal A en Astillada, los conmutadores PAL, SP, un magnetoscopio y dos cabezales, y al lado el fotograma reproducido desde la cinta con una estela de pérdidas."
g_fx_vhs_tape_cap = "VHS Tape: el panel del magnetoscopio con el cabezal A en Astillada y el fotograma que reproduce la cinta."
g_fx_vhs_tape_body = "La imagen se graba en una cinta modelada y se vuelve a leer; un clic en un cabezal del tambor lo ensucia, lo obstruye o lo astilla, y se puede cambiar SP/LP/EP, 2 o 4 cabezales, TBC o dos magnetoscopios. El sonido sale del mismo magnetoscopio: pistas Hi-Fi que crepitan donde un cabezal rompe la imagen, o la pista lineal con siseo y fluctuación."
g_masks_alt = "Una ciudad de noche en la previsualización con una máscara de pluma alrededor del perfil de los edificios: el contorno con sus puntos, la línea discontinua del desvanecido por fuera y un tinte azul de Duotone solo dentro de la máscara."
g_masks_cap = "Una máscara de pluma con sus puntos y su desvanecido; un Duotone tiñe solo el perfil de la ciudad dentro de ella."
masks_title = "Máscaras"
masks_body = "Rectángulo, elipse y pluma Bézier, dibujados sobre la previsualización. Una máscara recorta la imagen del evento, limita un efecto o recorta una pista entera. Cada una tiene desvanecimiento, expansión, opacidad, inversión y un modo (Añadir, Restar, Intersecar, Diferencia); varias máscaras se combinan de arriba abajo y la forma admite claves en el tiempo."

[more]
title = "Transiciones, rótulos, generadores"
transitions_title = "33 transiciones"
transitions_body = "Cortinillas, iris, reloj, empuje, deslizamiento, zoom, giro, barrido, persianas, cubo, vuelta de página, fallo, quemadura de película, fugas de luz y otras. Sus parámetros se automatizan igual que los de los efectos. El campo Tipo muestra cada tipo como una imagen del corte a mitad de la transición."
titles_title = "Rótulos"
titles_body = "Preajustes para rótulos de nombre, titulares, máquina de escribir, texto en desplazamiento y créditos finales. Fuente, alineación, relleno, contorno, sombra y fondo se ajustan en cada rótulo. El texto puede ser escrito, o un código de tiempo, un cronómetro o una cuenta atrás en marcha."
generators_title = "Generadores"
generators_body = "Colores sólidos, degradados, formas, fondos en movimiento, una cuenta atrás y señales de prueba. Entre las formas hay polígono, estrella, flecha, marco, placa de tercio inferior y barra de progreso; los fondos en movimiento son degradado en movimiento, plasma, partículas y patrón. Destello de sincronía pone un destello y un pitido en el mismo fotograma, y Zonas seguras dibuja los marcos de acción y de títulos. Generadores de sonido en una pista de audio: tono, ruido de audio, barrido senoidal, tren de pitidos y silencio."

[morpher]
title = "Mórfer"
standfirst = "Un mórfer está en su propia pista y, mientras dura, cambia los eventos que tiene debajo: aplica un lote de efectos, sustituye el origen o ambas cosas. Tiene fundidos y control de intensidad, y se puede aplicar a los eventos."
shot_alt = "El editor de lote FX del mórfer: actúa sobre una lista fija de seis clips, encadena una sustitución de origen con VHS Tape, fija la intensidad con entrada y salida graduales, elige el nuevo archivo de origen y ofrece aplicar y eliminar."
shot_cap = "Seis eventos de destino: sustitución de origen, luego VHS Tape."
swap_title = "Sustitución de origen"
swap_body = "Sustituye el origen de los eventos de destino, por ejemplo el material bruto por el máster etalonado, o desplaza todos los puntos de entrada la misma cantidad. Cortes, duraciones y posiciones no cambian."
batch_title = "Lote de efectos"
batch_body = "El lote puede contener efectos de vídeo y de audio. Se añade a la cadena de efectos de cada evento de destino y actúa al momento, sin renderizar. En VHS Tape, Datamosh y Camera ISP la mitad de sonido está junto a la de imagen, y cualquiera de las dos se puede desactivar para la capa."
delete_title = "Eliminar"
delete_body = "El mórfer no modifica los eventos, así que al eliminarlo el montaje vuelve a su estado anterior."
bake_title = "Aplicar"
bake_body = "Aplicar escribe el mórfer en los eventos y lo quita; imagen y sonido quedan idénticos. La aplicación se puede deshacer."

[bin]
title = "Panel de medios"
standfirst = "Los archivos importados aparecen en el panel como tarjetas. Los archivos que faltan se abren como marcadores de posición y se vuelven a conectar cuando aparecen."
shot_alt = "El panel de medios en disposición libre: grupos con nombre para metraje, música y medios generados, tarjetas de vídeo con fotograma de muestra y duración, música dibujada como forma de onda y generadores de texto."
shot_cap = "El nombre del grupo está en un hueco de su marco.<br>Las tarjetas muestran un fotograma, la duración o una forma de onda."
poster_title = "Miniaturas"
poster_body = "La tarjeta de un vídeo muestra un fotograma representativo del archivo en lugar del primero."
scrub_title = "Recorrido"
scrub_body = "Al pasar el ratón por una tarjeta, el archivo se reproduce y se muestra el tiempo del archivo bajo el cursor."
wave_title = "Formas de onda"
wave_body = "Las tarjetas de audio muestran la forma de onda del archivo."
groups_title = "Grupos"
groups_body = "Las tarjetas se pueden agrupar, nombrar y bloquear. Un grupo se mueve entero."
layout_title = "Disposición"
layout_body = "Disposición libre o cuadrícula. La colocación se guarda en el proyecto."
drag_title = "Arrastrar a la línea de tiempo"
drag_body = "Una tarjeta arrastrada a una pista cae con el momento recorrido bajo el ratón; <kbd>Alt</kbd> pone ahí el inicio del archivo, <kbd>Alt</kbd>+<kbd>Shift</kbd> su final. Antes de soltar, el contorno en la pista muestra la duración y la posición del archivo."

[export]
title = "Exportar"
standfirst = "MP4, MOV, MKV o WebM; vídeo H.264, H.265, AV1, VP9 o ProRes 422 HQ; sonido AAC, Opus, PCM o FLAC a 48 kHz estéreo. Con una región fijada se renderiza la región o, si se elige, el proyecto entero."
shot_alt = "Ajustes de render: códec de vídeo en automático con prioridad para el hardware, calidad CRF, tasa de bits del audio, resolución del proyecto, AAC 48 kHz estéreo, contenedor MP4 con faststart."
shot_cap = "Ajustes de render: códec, calidad, audio y contenedor."
encoder_title = "Elección del codificador"
encoder_body = "En modo automático se prueban por turno los codificadores por hardware del códec elegido, y cada uno se abre antes de usarlo; el que no se abre se omite. El codificador también se puede elegir a mano. Lo que el FFmpeg instalado o el contenedor no admiten aparece en gris con el motivo."
quality_title = "Calidad"
quality_body = "Calidad constante, tasa media con un máximo o tasa constante; velocidad del codificador, intervalo de fotogramas clave, fotogramas B, 8 o 10 bits, BT.601 o BT.709 con rango limitado o completo; el tamaño del proyecto, uno predefinido hasta 2160p o uno propio; la frecuencia de fotogramas. Los ajustes se guardan como preajustes que se conservan entre proyectos."
progress_title = "Progreso"
progress_body = "La ventana de render nombra el codificador antes del primer fotograma y muestra la fase, el tiempo restante, la velocidad con un gráfico, el tamaño del archivo y la tasa de bits; su registro va al diario de telemetría. Si el rango ya se reprodujo, predice el tiempo de render y compara el tamaño de la previsualización con el del archivo. Al terminar da la sonoridad del resultado (LUFS, pico real) y abre el archivo o su carpeta. El render se puede pausar o cancelar. Un archivo existente solo se reemplaza después de una pregunta."
inproc_title = "Sin archivos intermedios"
inproc_body = "La codificación y el multiplexado se hacen dentro del proceso del editor, sin escribir archivos temporales."
cli_title = "kt-cli"
cli_body = "La herramienta de línea de comandos renderiza y exporta un archivo de proyecto con los ajustes de la ventana de render, sin ventana ni pantalla."

[care]
title = "Guardado y recuperación"
autosave_title = "Guardado automático"
autosave_body = "Cada 30 segundos, si el proyecto cambió, la edición se escribe en un archivo de recuperación junto al proyecto; solo <kbd>Ctrl</kbd>+<kbd>S</kbd> escribe el proyecto. Durante una reproducción larga también se escribe el archivo de recuperación. Los archivos se escriben de forma atómica, así que un cierre inesperado no deja un proyecto a medio escribir."
readable_title = "Archivos de proyecto"
readable_body = "Un proyecto es un archivo JSON con rutas relativas a los medios, así que una carpeta copiada o movida sigue funcionando, también entre Linux y Windows. Una ruta absoluta del otro sistema se abre como marcador de posición. En el proyecto se guardan la vista, los nombres de las pistas y la disposición del panel."
cache_title = "Caché"
cache_body = "Las formas de onda y las miniaturas se guardan en un archivo junto al proyecto. Si se borra o cambia un archivo de origen, solo se reconstruye lo afectado."
warnings_title = "Diagnóstico"
warnings_body = "La ventana de diagnóstico muestra cuánta memoria ocupa el programa y de qué se compone, los fotogramas mostrados frente a los perdidos y tres gráficas en el tiempo: reproducción, actividad de FFmpeg y caché. El diario de telemetría registra la reproducción, los avisos y las acciones del usuario con la hora; <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>M</kbd> marca un momento en él. Se queda en el ordenador. Si el programa falla, una ventana nombra la parte que falló y ofrece Restaurar el proyecto."

