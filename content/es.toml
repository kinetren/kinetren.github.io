# kinetren landing — Español. The key set and order are defined by en.toml.
# Markup in values: <em> <strong> <kbd> <code> <br>.
# Not translated: kinetren, MP4, H.264, AAC, FFmpeg and effect names (rule 4 of
# i18n/README.md). Terms follow the editor's own es.toml (región, bobina,
# cursor, pista, evento, mórfer, preajustes).

[site]
tagline = "Editor de vídeo gratuito para Linux y Windows, con el código fuente disponible."
nav_edit = "Línea de tiempo"
nav_effects = "Efectos"
nav_morpher = "Mórfer"
nav_export = "Exportar"
nav_roadmap = "Planes"
nav_docs = "Documentación"
nav_get = "Descargar"
lang_label = "Idioma"
skip = "Ir al contenido"
footer_desc = "Editor de vídeo para Linux y Windows"
credits = "Créditos del metraje"
source = "Código fuente"

# Self-names of the languages. Identical in every catalog — copied verbatim
# from the application's own [lang] section, do not translate them.
[lang]
en = "English"
es = "Español"
zh = "中文（简体）"
ar = "العربية"
ru = "Русский"

[hero]
eyebrow = "Editor de vídeo · Linux · Windows"
h1 = "Editor de vídeo gratuito <em>para Linux y Windows</em>"
lede = "Línea de tiempo multipista con previsualización en tiempo real, bobinas anidadas, 33 transiciones, 26 efectos de vídeo y 18 de audio, automatización con curvas en cualquier parámetro, rótulos y generadores. La exportación a MP4 renderiza exactamente lo que muestra la previsualización."
cta_primary = "Descargar"
cta_secondary = "Funciones"
cta_note = "Linux x86_64 · Windows 10/11"
shot_alt = "La ventana de kinetren durante la reproducción: a la izquierda el panel de medios con metraje, música y rótulos generados en grupos con nombre; en el centro la previsualización con vúmetros; abajo una línea de tiempo multipista con marcadores con nombre, rótulos, vídeo, música y una pista de mórfer."

[stats]
vfx = "efectos de vídeo"
vfx_list = "Geometry · Mirror · Corner Pin · Blur · Sharpen · Radial Blur · Greenscreen · Drop Shadow · Edges · Noise · VHS · Event Grid · Vignette · Pixelate · Halftone · Glow · Pan 3D · Cylinder 3D · Color Grade · Duotone · Posterize · Chromatic Aberration · Lens Distort · Twirl · Ripple · Kaleidoscope"
afx = "efectos de audio"
afx_list = "Gain · Slowed+Reverb · Pitch Shift · Filter · EQ · Distortion · Bitcrusher · Tremolo · AutoPan · Vibrato · Chorus · Flanger · Phaser · Delay · Compressor · Gate · Limiter · Stereo Width"
transitions = "transiciones"
transitions_list = "Fundido cruzado · Cortinilla · Iris · Reloj · Puertas · Cortinilla por luma · Empuje · Deslizamiento · Zoom cruzado · Giro · Barrido · Disolución con desenfoque · Pixelado · Fallo · Destello · Paso por color · Persianas · Damero · Bloques aleatorios · Espiral · División · Compresión · Estiramiento · Intercambio · Sacudida · Quemadura de película · Fugas de luz · Desenfoque radial · Volteo · Cubo · Puertas dobles · Vuelta de página · Rollo de página"
tracks = "tipos de pista"
tracks_list = "Vídeo · Audio · Morph · Cámara"
langs = "idiomas de la interfaz"
langs_list = "English · Español · 中文（简体） · العربية · Русский"

[why]
title = "Render"
ship_title = "Un solo camino de render"
ship_body = "La previsualización y la exportación a MP4 componen el fotograma con el mismo código. El fotograma exportado es el que se vio en la previsualización."
same_title = "Resultado repetible"
same_body = "El mismo proyecto renderizado dos veces en la misma máquina da archivos idénticos, se haya reproducido o recorrido lo que sea entre ambos renders."
stall_title = "El desplazamiento no decodifica vídeo"
stall_body = "Las formas de onda, las tiras de fotogramas y las miniaturas se leen de un índice que se crea una vez por archivo. El desplazamiento y el zoom de la línea de tiempo solo usan ese índice."
gpu_title = "Codificación por hardware"
gpu_body = "Los codificadores de NVIDIA, AMD e Intel se detectan automáticamente, con un codificador por software como alternativa. La exportación no escribe archivos temporales."

[edit]
title = "Línea de tiempo"
standfirst = "Pistas de vídeo, audio y morph. Cada pista tiene silencio, solo, bloqueo, sus propios efectos, opacidad y modo de fusión. Una pista se mueve arrastrando su cabecera."
shot_alt = "Línea de tiempo de cerca en el marcador DROP: una bobina anidada abierta en su sitio, con sus propias pistas de texto, vídeo y audio entre las pistas principales y las partes fuera de la instancia veladas a ambos lados; tiras de fotogramas en los clips de vídeo y formas de onda en las pistas de audio."
shot_cap = "La bobina STINGER desplegada en mitad del montaje. Las partes de la bobina fuera de esta instancia aparecen veladas."
cut_title = "Cortar y recortar"
cut_body = "<kbd>S</kbd> corta en el cursor. El borde de un evento se recorta arrastrándolo."
region_title = "Región"
region_body = "<kbd>I</kbd> y <kbd>O</kbd> fijan la región. Se puede copiar, borrar, recortar de todos los eventos que cruza, reproducir en bucle y renderizar."
snap_title = "Ajuste"
snap_body = "Los eventos se ajustan a los bordes de otros eventos, a los marcadores, a los límites de la región, al cursor y al cero. Con <kbd>Ctrl</kbd> pulsado el ajuste se desactiva al arrastrar."
marker_title = "Marcadores"
marker_body = "<kbd>M</kbd> añade un marcador y abre el campo de su nombre. Los marcadores se arrastran por la regla y aparecen en la búsqueda."
reels_title = "Bobinas"
reels_body = "Una selección se agrupa en una bobina que se puede usar cuantas veces se quiera; los cambios en la bobina se aplican a todas las copias. <kbd>Enter</kbd> despliega la bobina en la línea de tiempo. Los parámetros publicados dan a cada copia sus propios valores."
fades_title = "Fundidos y fundidos cruzados"
fades_body = "Un fundido se ajusta arrastrando las esquinas superiores del evento. Si se arrastra un evento sobre otro, se obtiene un fundido cruzado. La opacidad y el volumen tienen una línea de nivel sobre el evento."
find_title = "Búsqueda"
find_body = "<kbd>Ctrl</kbd>+<kbd>F</kbd> busca medios, eventos, marcadores, pistas y grupos del panel por nombre. <kbd>Ctrl</kbd>+<kbd>L</kbd> salta al código de tiempo escrito."
undo_title = "Deshacer"
undo_body = "Se puede deshacer cualquier cambio, incluidos los mórferes y su aplicación. Un arrastre es un paso de deshacer."

[playback]
title = "Reproducción"
standfirst = "El audio marca el tiempo y la imagen lo sigue, así que imagen y sonido no se desfasan en líneas de tiempo largas."
speed_title = "Barras de velocidad"
speed_body = "La barra superior fija una velocidad constante de −2× a +2×. La inferior es un shuttle que vuelve a cero al soltarlo; si se arrastra más allá de su extremo, llega a ±8×. Un doble clic en cualquiera de las dos vuelve a 1×."
space_title = "Mantener Espacio"
space_body = "Con <kbd>Space</kbd> pulsado, la reproducción acelera hasta 4× en cinco segundos; al soltarlo, frena. Una pulsación corta reproduce o pausa; dos seguidas paran al inicio de la región."
reverse_title = "Reproducción inversa"
reverse_body = "La velocidad negativa reproduce imagen y sonido hacia atrás con precisión de fotograma. Un evento también se puede invertir en sus propiedades."
loop_title = "Bucle"
loop_body = "La región se repite sin hueco: su inicio se mantiene en la caché."
meters_title = "Vúmetros"
meters_body = "Medidores por segmentos en escala de decibelios con retención de pico y un fader maestro en dB. En pausa, al recorrer el material, el medidor muestra el nivel bajo el cursor."
detach_title = "Segundo monitor"
detach_body = "Un doble clic en la previsualización la abre en una ventana aparte. Al cerrar la ventana, la previsualización vuelve a su sitio."

[effects]
title = "Efectos"
standfirst = "Los efectos se encadenan en un evento o en una pista. Las ranuras se reordenan y se desactivan, la previsualización se actualiza al momento y la exportación ejecuta el mismo código. Cualquier cadena se puede guardar como preajuste."
fx_cap = "26 efectos de vídeo. La galería muestra cada uno sobre un fotograma del evento seleccionado."
shot_alt = "La ventana de efectos de vídeo con el selector abierto: un campo de búsqueda, preajustes con miniaturas del clip y efectos agrupados por categoría, cada uno con su tira de miniaturas."
audio_title = "Audio"
list_title = "18 efectos de audio"
list_body = "Gain, Slowed+Reverb, Pitch Shift, Filter, EQ, Distortion, Bitcrusher, Tremolo, AutoPan, Vibrato, Chorus, Flanger, Phaser, Delay, Compressor, Gate, Limiter, Stereo Width. Un compresor en una pista de música puede bajarla bajo la voz."
slowed_title = "Slowed+Reverb"
slowed_body = "Ralentiza el material bajando el tono y añade reverberación con retardo, caída, amortiguación y nivel de efecto. En un evento de vídeo ralentiza también la imagen."
note = "Cualquier parámetro de cualquier efecto, transición o rótulo se automatiza con curvas. Las claves de automatización están ligadas al material de origen: recortar un evento no las mueve. La cola de la reverberación sigue sonando después del final del evento."
shot2_alt = "La ventana de efectos de audio de un clip: parámetros de Slowed+Reverb y, debajo, el gráfico de automatización con curvas de rate y mix por claves."
shot2_cap = "Curvas de rate y mix de Slowed+Reverb. Los puntos se arrastran y una envolvente se puede copiar a otro evento."

[more]
title = "Transiciones, rótulos, generadores"
transitions_title = "33 transiciones"
transitions_body = "Cortinillas, iris, reloj, empuje, deslizamiento, zoom, giro, barrido, persianas, cubo, vuelta de página, fallo, quemadura de película, fugas de luz y otras. Sus parámetros se automatizan igual que los de los efectos."
titles_title = "Rótulos"
titles_body = "Preajustes para rótulos de nombre, titulares, máquina de escribir, texto en desplazamiento y créditos finales. Fuente, alineación, relleno, contorno, sombra y fondo se ajustan en cada rótulo."
generators_title = "Generadores"
generators_body = "Colores sólidos, degradados, formas, una cuenta atrás y señales de prueba."

[morpher]
title = "Mórfer"
standfirst = "Un mórfer está en su propia pista y, mientras dura, cambia los eventos que tiene debajo: aplica un lote de efectos, sustituye el origen o ambas cosas. Tiene fundidos y control de intensidad, y se puede aplicar a los eventos."
shot_alt = "El editor de lote FX del mórfer: actúa sobre una lista fija de seis clips, encadena una sustitución de origen con VHS y Glow, fija la intensidad con entrada y salida graduales, elige el nuevo archivo de origen y ofrece aplicar y eliminar."
shot_cap = "Seis eventos de destino: sustitución de origen, luego VHS y Glow."
swap_title = "Sustitución de origen"
swap_body = "Sustituye el origen de los eventos de destino, por ejemplo el material bruto por el máster etalonado, o desplaza todos los puntos de entrada la misma cantidad. Cortes, duraciones y posiciones no cambian."
batch_title = "Lote de efectos"
batch_body = "El lote se añade a la cadena de efectos de cada evento de destino y actúa al momento, sin renderizar."
delete_title = "Eliminar"
delete_body = "El mórfer no modifica los eventos, así que al eliminarlo el montaje vuelve a su estado anterior."
bake_title = "Aplicar"
bake_body = "Aplicar escribe el mórfer en los eventos y lo quita; imagen y sonido quedan idénticos. La aplicación se puede deshacer."

[bin]
title = "Panel de medios"
standfirst = "Los archivos importados aparecen en el panel como tarjetas. Los archivos que faltan se abren como marcadores de posición y se vuelven a conectar cuando aparecen."
shot_alt = "El panel de medios en disposición libre: grupos con nombre para metraje, música y medios generados, tarjetas de vídeo con fotograma de muestra y duración, música dibujada como forma de onda y generadores de texto."
shot_cap = "El nombre del grupo está en un hueco de su marco.<br>Las tarjetas muestran un fotograma, la duración o una forma de onda."
poster_title = "Miniaturas"
poster_body = "La tarjeta de un vídeo muestra un fotograma representativo del archivo en lugar del primero."
scrub_title = "Recorrido"
scrub_body = "Al pasar el ratón por una tarjeta, el archivo se reproduce."
wave_title = "Formas de onda"
wave_body = "Las tarjetas de audio muestran la forma de onda del archivo."
groups_title = "Grupos"
groups_body = "Las tarjetas se pueden agrupar, nombrar y bloquear. Un grupo se mueve entero."
layout_title = "Disposición"
layout_body = "Disposición libre o cuadrícula. La colocación se guarda en el proyecto."
drag_title = "Arrastrar a la línea de tiempo"
drag_body = "Mientras se arrastra una tarjeta, la línea de tiempo muestra el contorno del evento, la pista de destino y la línea de ajuste."

[export]
title = "Exportar"
standfirst = "MP4: vídeo H.264, AAC 48 kHz estéreo, faststart. Si hay una región fijada, solo se renderiza la región."
shot_alt = "Ajustes de render: códec de vídeo en automático con prioridad para el hardware, calidad CRF, tasa de bits del audio, resolución del proyecto, AAC 48 kHz estéreo, contenedor MP4 con faststart."
shot_cap = "Ajustes de render: códec, calidad, audio y contenedor."
encoder_title = "Elección del codificador"
encoder_body = "En modo automático se prueban por turno los codificadores por hardware, y cada uno se abre antes de usarlo; el que no se abre se omite. El codificador también se puede elegir a mano."
quality_title = "Calidad"
quality_body = "CRF o tasa de bits objetivo, audio de 128 a 320 kbps, la resolución del proyecto o cualquier tamaño hasta 4K."
progress_title = "Progreso"
progress_body = "La ventana de render muestra la fase, el tiempo restante y la velocidad respecto al tiempo real. El render se puede pausar o cancelar."
inproc_title = "Sin archivos intermedios"
inproc_body = "La codificación y el multiplexado se hacen dentro del proceso del editor, sin escribir archivos temporales."
cli_title = "kt-cli"
cli_body = "La herramienta de línea de comandos renderiza y exporta un archivo de proyecto sin ventana."

[care]
title = "Guardado y recuperación"
autosave_title = "Guardado automático"
autosave_body = "Cada 30 segundos si el proyecto cambió, pero no durante un arrastre ni la reproducción. Los archivos se escriben de forma atómica, así que un cierre inesperado no deja un proyecto a medio escribir."
readable_title = "Archivos de proyecto"
readable_body = "Un proyecto es un archivo JSON con rutas relativas a los medios, así que una carpeta copiada o movida sigue funcionando. En él se guardan la vista, los nombres de las pistas y la disposición del panel."
cache_title = "Caché"
cache_body = "Las formas de onda y las miniaturas se guardan en un archivo junto al proyecto. Si se borra o cambia un archivo de origen, solo se reconstruye lo afectado."
warnings_title = "Diagnóstico"
warnings_body = "La ventana de diagnóstico muestra el llenado de la caché y los fotogramas mostrados frente a los perdidos. Si la decodificación no alcanza a la reproducción, aparece un aviso."

[keys]
title = "Teclado"
standfirst = "kinetren no tiene información emergente. La línea de ayuda de la parte inferior de la ventana describe el control que hay bajo el cursor."
g_transport = "Transporte"
g_editing = "Edición"
g_region = "Región y marcadores"
